name: Mirror CI images

# Copies every image ci.yml uses into GHCR, so CI never hits the anonymous
# Docker Hub / public.ecr.aws pull limits (#1688). The matrix is the list.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - .github/workflows/mirror-images.yml

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: 'pgvector/pgvector:pg16', dst: 'ci-pgvector:pg16' }
          - { src: 'postgis/postgis:16-3.4', dst: 'ci-postgis:16-3.4' }
          - { src: 'public.ecr.aws/docker/library/postgres:16-alpine', dst: 'ci-postgres:16-alpine' }
          - { src: 'public.ecr.aws/docker/library/mysql:8.0', dst: 'ci-mysql:8.0' }
          - { src: 'public.ecr.aws/docker/library/mysql:8', dst: 'ci-mysql:8' }
          - { src: 'public.ecr.aws/docker/library/redis:6', dst: 'ci-redis:6' }
          - { src: 'public.ecr.aws/docker/library/redis:7', dst: 'ci-redis:7' }
          - { src: 'bitnamilegacy/minio:2025.7.23-debian-12-r5', dst: 'ci-minio:2025.7.23-debian-12-r5' }
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull, retag, push
        env:
          SRC: ${{ matrix.src }}
          DST: ghcr.io/${{ github.repository_owner }}/${{ matrix.dst }}
        run: |
          for i in 1 2 3 4 5; do
            docker pull "$SRC" && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 20))
          done
          docker tag "$SRC" "$DST"
          docker push "$DST"
