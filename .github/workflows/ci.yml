name: CI

# Least privilege for every job. CodeQL flags a workflow with no
# `permissions:` block because the default token can write to the repo —
# contents, issues, packages — and CI only ever needs to read the code.
# Declared at the top rather than per job so a job added tomorrow
# inherits it instead of being the next one flagged.
permissions:
  contents: read

on:
  push:
    # `develop` is the default branch and where every PR lands, but it
    # was absent here — so a merge into it ran nothing, and the branch
    # everyone builds on had no post-merge gate. Only `main` (release)
    # was covered. PRs were checked, which hides the gap right up until
    # a squash-merge combination behaves differently from its PR.
    #
    # Release branches are named here too. They used to be covered only
    # through their PR, so a push straight to a release branch — which is
    # the one place this repo allows it — ran nothing. The glob is loose
    # on purpose: `release/v0.57.6`, `releases/x`, `hotfix-release` all
    # match, because the cost of missing a release branch is a tagged
    # build nobody checked.
    branches:
      - main
      - develop
      - '**release**'
      - '**Release**'
  # Only PRs **into** an integration branch reach the workflow.
  #
  # `branches:` filters on the *base*, so this is "where is it going",
  # not "where did it come from". A PR into a feature branch — stacking
  # work, a review split, someone's scratch base — now runs nothing at
  # all, where before every PR in the repo pulled the ungated jobs
  # (`fmt`, `clippy`, `guards`, `doc`, `deny`, `deny-examples`,
  # `lockfiles`, `trivy`). Those are minutes each and were being spent
  # on merges that cannot reach `main` without a second PR that runs
  # them again.
  #
  # The globs match the `push:` list above deliberately: a branch worth
  # a post-merge run is a branch worth checking the PR into it.
  #
  # Once a PR *does* reach the workflow, the `gate` job below decides
  # whether the expensive matrix runs on top of the ungated jobs.
  # `labeled` is in `types:` so adding the opt-in label to an open PR
  # starts a run immediately rather than waiting for the next push.
  #
  # Checking a feature branch that no such PR covers: `workflow_dispatch`
  # below, or open the PR into its real base.
  pull_request:
    branches:
      - main
      - develop
      - '**release**'
      - '**Release**'
    types: [opened, synchronize, reopened, labeled]
  # Lets a run be triggered by hand against any branch, without
  # inventing a no-op commit or opening a throwaway PR — useful for
  # re-checking a branch after an advisory lands, since `deny` can go
  # red with no code change at all. With PR runs narrowed above, this is
  # also how you check a feature branch before merging it.
  workflow_dispatch:

# One run per ref at a time; a new push cancels the one it supersedes.
#
# This is where the CI time was going. Nothing cancelled anything, so
# pushing three commits to an open PR left three full 20-job matrices
# running, two of them against code already replaced. The result of a
# superseded run is not interesting — it describes a commit nobody will
# merge.
#
# Push runs — `main`, `develop` and the release branches — are excluded
# from cancellation deliberately: those runs are the record for a commit
# that is already merged, and cancelling one leaves that commit with no
# build behind it.
#
# (An earlier version of this comment said "and tags". It never applied:
# `on: push:` names `branches:` with no `tags:` key, so a tag push does
# not trigger this workflow at all.)
#
# `develop` matters more than it looks, because PRs into it are ungated.
# An unlabelled PR merges with only the cheap checks; the post-merge push
# run is the first time the live matrix sees that code at all. Cancelling
# it on the next merge means a commit can reach the branch everyone
# builds on having never completed a single test run — which is the hole
# the gate was supposed to leave open only until merge, not past it.
#
# Feature branches and pull requests still cancel, which is where the
# waste actually was.
# The group is per-COMMIT on a push and per-ref everywhere else.
#
# Excluding a branch from cancellation is not enough to guarantee a build
# per merged commit. With `cancel-in-progress: false` GitHub queues the
# newcomer instead of cancelling the running job — but it keeps only the
# most recent *pending* run in a group and cancels any earlier one. So
# with a per-ref group, merging A, B and C in quick succession runs A,
# queues B, and then discards B when C arrives. B is a commit on
# `develop` that never got a build.
#
# Keying push runs by SHA gives every commit its own group, so none of
# them can evict another. Pull requests and manual dispatches stay
# per-ref, which is where superseding is the point: a new push to a PR
# should cancel the run describing the code it replaced.
concurrency:
  # Three keyings, not two. A `labeled` event gets its **own** group.
  #
  # Excluding it from cancellation was not enough on its own: with
  # `cancel-in-progress: false` the label run landed in the same per-ref
  # group as the run already going, so GitHub *queued* it behind that
  # run instead of starting it — and a second label event would evict it
  # from the pending slot entirely. The comment below used to claim the
  # opposite ("it starts the matrix without waiting for a push"), which
  # holds only when nothing is already running on the ref.
  #
  # Its own group means adding `ci` starts the matrix immediately and
  # discards nothing; cancellation inside that group is then correct,
  # because a second label event really does supersede the first.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'push'
      && github.sha
      || github.event.action == 'labeled'
      && format('{0}-labeled', github.ref)
      || github.ref }}
  # Keyed on the same thing the group is, or the pair disagrees.
  #
  # This used to test the *ref* while the group keyed on the SHA, which
  # left one way for a push run to be cancelled after all: two pushes of
  # the same commit to different refs share a group, and the ref test
  # would say "cancel" for whichever ref was neither `main` nor
  # `develop`. `git push origin develop:release/v0.57.7` — a release-flow
  # push of develop's tip — is exactly that, and it would have cancelled
  # develop's own post-merge run.
  #
  # A push group is per-commit, so there is never a superseded run in it
  # worth cancelling. Everything else is per-ref, where cancelling is the
  # point.
  #
  # The trigger fires on *every* label event, not just `ci` — sixteen
  # labels exist on this repo and Dependabot adds `dependencies` on its
  # own. Labelling a PR with a run in flight used to cancel it and start
  # over: up to twenty jobs discarded for adding the word "bug". The
  # separate group above is what stops that, so this can stay keyed on
  # the one thing it is about — a push run is per-commit and has no
  # superseded sibling to cancel.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  # v0.30.23 — dropped global `RUSTFLAGS: "-D warnings"`. It was
  # promoting every clippy + test warning (812 in clippy, dead-code
  # in test fixtures, etc.) to a build error. The matching local
  # pre-push hook treats warnings as warnings; CI now does the
  # same. Real type errors / broken tests still fail the build.
  # DATABASE_URL is deliberately NOT set here. It used to be, and every
  # job inherited a URL pointing at a Postgres that only four of them
  # actually run — so `mysql_live`, `sqlite_litmus`, `windows_test` and
  # the rest all claimed a database they did not have.
  #
  # That was harmless while suites skipped on a failed connect. #1440
  # made them fail loudly instead, which is right, and turned this into
  # a job that fails on a database it was never supposed to reach. The
  # variable now lives on the jobs that have the service.
  #
  # Strip debuginfo from every build profile in CI. The `postgres_test`
  # job links the full workspace `--all-features`, which is ~450
  # statically-linked integration-test binaries; with the default
  # `debug = true` on both `[profile.dev]` (dependency rlibs) and
  # `[profile.test]` (the test crates), full DWARF dominates each binary
  # and the cumulative `target/` blows past the runner's free disk at
  # link time (`ld: final link failed: No space left on device`) — even
  # after `jlumbroso/free-disk-space` reclaims ~35 GB. CI never debugs
  # interactively, so dropping debuginfo is free here: panic messages +
  # the failing test's name still surface; only backtrace line numbers
  # go. Set on both profiles because `cargo test` builds the dependency
  # graph with `dev` and the test targets with `test`.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Does the *expensive* half run for this event?
  #
  # Every job that needs a server, a container, or a full workspace build
  # is `needs: gate`, so this is the single place the answer lives.
  # Copies of the same `if:` would drift, which is the failure this repo
  # keeps paying for elsewhere.
  #
  # What is NOT gated: `fmt`, `clippy`, `guards`, `doc`, `deny`,
  # `deny-examples`, `lockfiles`, `trivy` and `tests_compile`. Those run on
  # every pull request, always. Gating them was a mistake — it meant a
  # feature PR into `develop` merged with no signal whatsoever, including
  # no dependency-advisory or container scan, when the intent was only to
  # defer the live matrix.
  #
  # The test for whether a job belongs here is not "is it fast" but "does
  # its absence let a defect reach `develop` unseen". Eight of the nine are
  # minutes, and together a fraction of one live job. `tests_compile` is
  # the exception and is deliberately ungated anyway: it costs a cold
  # `--all-features` build, and gating it would restore exactly the hole it
  # exists to close (#1572). `every_test_suite_compiles_in_ci` fails if
  # anyone adds `needs:`, `if:` or `continue-on-error:` to it.
  #
  # It runs when:
  #   * the event is not a pull request — a push to `main`, `develop` or
  #     a release branch, or a manual `workflow_dispatch`;
  #   * the PR targets `main`, which is the release promote;
  #   * the PR carries the `ci` label. **That is the manual trigger for
  #     an ordinary feature PR**: add the label and the full matrix runs
  #     against the merge result; remove it and later pushes go quiet.
  gate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'main'
      || contains(github.event.pull_request.labels.*.name, 'ci')
    steps:
      - name: Why this run is happening
        run: |
          echo "event=${{ github.event_name }} base=${{ github.base_ref }}"
          echo "Add the ci label to a pull request to run this matrix on it."

  # Ungated, along with `clippy`, `deny`, `deny-examples`, `lockfiles`
  # and `trivy`. These are minutes, not the matrix, and two of them are
  # security checks — gating them meant an ordinary PR into `develop`
  # merged with no signal at all, not merely without the live suites.
  # The `ci` label buys the expensive jobs; it should not be what buys
  # `cargo fmt --check`.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # v0.30.22 — aligned with the local pre-push hook
      # (see .githooks/pre-push). Pre-v0.30.22 CI ran the
      # `--workspace --all-targets -- -D warnings` form which
      # surfaced ~70 clippy::pedantic errors on the macros crate
      # (doc_markdown, too_many_lines, items_after_statements)
      # that the pre-push hook treats as warnings only. Real
      # errors still surface in the `postgres_test` job via rustc.
      # `--all-targets` rather than `--lib`: on an unlabelled PR this is
      # the only job that compiles `crates/rustango/tests/**` at all, so
      # `--lib` meant a test file that does not build merged green and
      # broke on the post-merge push run. Still `-p rustango`, which is
      # what keeps the macros crate's ~70 pedantic findings out of it —
      # the crate scope was doing that work, not `--lib`.
      - run: cargo clippy -p rustango --features tenancy --all-targets --no-deps

  # Ungated, deliberately: these are the structural guards, and gating
  # them put them out of reach of the pull requests that need them most.
  #
  # Every other test in this repo runs in exactly one place —
  # `postgres_test`'s `cargo test --workspace --all-features` — and that
  # job is `needs: gate`. So on an unlabelled PR into `develop`, a change
  # that adds a `*_tri.rs` or `*_mysql_live.rs` without the matching
  # `ci.yml` line passed everything it ran and merged; the guard written
  # to catch exactly that first fired post-merge, on develop's push run.
  # That is #1437's failure mode relocated from the suite to the guard.
  #
  # These nine need no database and no service container — they read the
  # source tree and the workflow file — so they cost seconds and can run
  # on every PR. `--features tenancy` matches `clippy` above so the two
  # jobs share a build.
  #
  # A guard that needs a live database does NOT belong here; it belongs
  # in `postgres_test` with the rest.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # No DATABASE_URL / MYSQL_TEST_URL is set here on purpose: under
      # the #1440 policy an unset var is a skip, and these guards must
      # not depend on one. If a guard added here starts needing a
      # database it will fail closed rather than skip silently.
      - run: |
          cargo test -p rustango --features tenancy \
            --test docs_links \
            --test docs_contract \
            --test docs_versions \
            --test docs_inventories \
            --test docs_live_suite_counts \
            --test every_live_suite_runs_in_ci \
            --test every_serve_shuts_down_gracefully \
            --test every_serving_path_is_observable \
            --test every_structural_guard_is_ungated \
            --test every_test_suite_compiles_in_ci \
            --test logging_fields_agree

  # Ungated, and the reason is #1572: a test file that does not build was
  # merging green.
  #
  # `default = ["postgres", "batteries"]`, and `batteries` pulls in neither
  # `sqlite` nor `mysql`. `clippy` is the only other ungated job that
  # compiles `tests/**`, and it runs `--features tenancy` on top of those
  # defaults — so every suite gated on a feature outside that set compiles
  # to an **empty crate** there. Evaluated against the feature set `clippy`
  # resolves, that is **275 of the 559 suites** in `crates/rustango/tests/`,
  # including every guard the 0.57.7 security pass added.
  #
  # The axes are `sqlite`, `mysql`, `mcp` (16 suites), `cache-redis`,
  # `cache-page`, `passkey`, `email-smtp` and `admin-sso`. `testkit` is
  # **not** one of them despite being outside `batteries`: the self
  # dev-dependency in crates/rustango/Cargo.toml turns it on for any
  # `cargo test` build.
  #
  # Those 275 executed only in `postgres_test` / `sqlite_live` /
  # `mysql_live`, every one `needs: gate`. So on an unlabelled PR into
  # `develop` they were neither run nor compiled, and a change that broke
  # one of their signatures merged with a green tick. That is #1437's
  # failure mode one layer down: not a suite that skips silently, but a
  # suite that is not built where anyone would notice.
  #
  # `--no-run` on purpose. This job answers "does it build with the features
  # that include it", which is the question `clippy` cannot answer and the
  # live jobs answer too late. Running them needs databases and belongs in
  # the gated matrix, per the `guards` header above.
  #
  # The second command is not redundant. Six suites are gated on a
  # **negated** feature, so `--all-features` compiles them out by
  # construction — five on `not(feature = "postgres")`, which this covers,
  # and `oauth2_router_standalone` on `not(feature = "admin")`, which the
  # third command covers.
  #
  # An earlier version of this comment said that last one was "still built
  # only in the gated `feature_combos`". That was false, and it is the
  # mistake this job exists to prevent, made while writing the job:
  # `feature_combos` runs `cargo check --lib` and `cargo test --lib`, and
  # **neither builds `tests/**`** — nor does any of its 13 rows enable
  # `oauth2`. The file was compiled by nothing at all. Checked, not
  # assumed, this time: `cargo test -p rustango --no-default-features
  # --features oauth2,manage,sqlite --test oauth2_router_standalone
  # --no-run` is the command below, and it was run.
  #
  # Cost: `--all-features` shares no build cache with `clippy` or `guards`
  # (both `--features tenancy`), so this is roughly one extra cold build per
  # PR, and it is the one ungated job that is not minutes. Nothing local
  # currently covers it either — `.githooks/pre-push` runs `cargo check`
  # (lib and bins; `--tests` is opt-in) and `cargo test --lib`, so the hook
  # would not have caught #1572 any more than `clippy` did.
  #
  # `timeout-minutes` because this job is reachable from a fork pull
  # request and builds three `build.rs` scripts that nothing ungated built
  # before — `libsqlite3-sys` with `bundled` compiles the SQLite C
  # amalgamation. The default is six hours.
  tests_compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-run
      # The `not(feature = "postgres")` family; same command `sqlite_litmus`
      # runs, which is gated.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --no-run
      # `oauth2_router_standalone`, gated on `not(feature = "admin")`. The
      # only shape that compiles it; nothing else in CI did.
      #
      # `--test` on purpose, unlike the two commands above. Building the
      # whole test surface under this narrow feature set fails on suites
      # whose `#![cfg]` under-specifies what they import — e.g.
      # `forms_prepare_save_sqlite_live` is gated on `sqlite` alone and
      # uses `rustango::forms`, which nothing here enables. Those gates
      # are wrong and only ever compiled because every job that built
      # them happened to have the feature on; that is its own class of
      # defect and its own change (#1594), not a reason to hold this job
      # back.
      - run: cargo test -p rustango --no-default-features --features oauth2,manage,sqlite --test oauth2_router_standalone --no-run

  # Primary PG test job — runs the full workspace with `--all-features`
  # against a real PostgreSQL service. Covers every PG-typed live test
  # (`*_live.rs`, `admin_live.rs`, `audit_live.rs`, `branding_live.rs`,
  # `jobs_pg_live.rs`, etc.) plus every unit test. Renamed from `test`
  # so each dialect has an explicitly-named job: `postgres_test`,
  # `mysql_live`, `sqlite_live`.
  postgres_test:
    needs: gate
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 + the `vector` extension
        # preinstalled (issue #824 — the vector live tests run
        # `CREATE EXTENSION vector`). A superset of the stock image, so
        # every existing PG test runs unchanged.
        #
        # NOTE: the other PG services here pull from the AWS Public ECR
        # mirror (`public.ecr.aws/docker/library/`) to dodge the
        # intermittent `registry-1.docker.io context deadline exceeded`
        # flakes (PR #848 / #866). That mirror only carries Docker Hub's
        # official `library/` namespace; pgvector lives in a user
        # namespace, so this one image comes straight from Docker Hub.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rustango
          POSTGRES_PASSWORD: rustango
          POSTGRES_DB: rustango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustango -d rustango_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rustango:rustango@localhost:5432/rustango_test
    steps:
      # The all-features workspace build (postgres + mysql + sqlite +
      # tenancy + admin + jobs-* + ...) produces a lot of test binaries
      # and outgrew the runner's default 14 GB free disk. Free the
      # pre-installed Android SDK / .NET / Haskell / large Docker
      # images + the apt large-packages set (~35 GB total) before
      # linking starts. `large-packages: true` was flipped from
      # false because we kept hitting `ld: No space left on device`
      # under load.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Ungated too. At ~62s it is two billed minutes, and the reasoning that
  # ungated `fmt` and `clippy` applies unchanged: a broken intra-doc link
  # merged into `develop` unnoticed is exactly the signal the gate was
  # never meant to remove.
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # v0.30.22 — dropped `RUSTDOCFLAGS=-D warnings` because the
      # vast majority of warnings are stylistic (bare URLs in
      # comments, `<T>` parsed as HTML tags by rustdoc, missing
      # backticks around generic types). Real broken intra-doc
      # links and parse errors still surface as build failures.
      - run: cargo doc --workspace --no-deps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The job above runs at the repo root, so it only ever sees the
  # workspace lockfile — `examples/` sits outside `members = ["crates/*"]`
  # and was invisible to it. That is how the quinn-proto advisory in #1236
  # reached us via a Dependabot alert instead of a failing build (#1237).
  #
  # Advisories only, deliberately: the example crates are unpublished and
  # carry no `license` field, so `check licenses` fails them as
  # `unlicensed` for reasons that have nothing to do with security.
  deny-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - examples/showcase/Cargo.toml
          - crates/rustango/examples/admin_demo/Cargo.toml
          - crates/rustango/examples/auth_demo/Cargo.toml
          - crates/rustango/examples/cookbook_blog/Cargo.toml
          - crates/rustango/examples/getting_started_blog/Cargo.toml
          - crates/rustango/examples/mcp_demo/Cargo.toml
          - crates/rustango/examples/orm_cookbook/Cargo.toml
          - crates/rustango/examples/platform_commerce/Cargo.toml
          - crates/rustango/examples/platform_commerce_saas/Cargo.toml
          - crates/rustango/examples/tenant_user_extension/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories

  # A committed lockfile buys reproducibility only if something actually
  # resolves against it. Nothing passed `--locked`, so every example
  # lock had drifted stale (#1422) — every local build rewrote them,
  # leaving a tracked file dirty in a shared worktree with no author, and
  # quietly disproving the guarantee `.gitignore` claims for them.
  #
  # `cargo metadata` only resolves, so this is seconds and no compile.
  lockfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - examples/showcase/Cargo.toml
          - crates/rustango/examples/admin_demo/Cargo.toml
          - crates/rustango/examples/auth_demo/Cargo.toml
          - crates/rustango/examples/cookbook_blog/Cargo.toml
          - crates/rustango/examples/getting_started_blog/Cargo.toml
          - crates/rustango/examples/mcp_demo/Cargo.toml
          - crates/rustango/examples/orm_cookbook/Cargo.toml
          - crates/rustango/examples/platform_commerce/Cargo.toml
          - crates/rustango/examples/platform_commerce_saas/Cargo.toml
          - crates/rustango/examples/tenant_user_extension/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: Committed lockfile is the one that resolves
        run: cargo metadata --locked --format-version 1 --manifest-path ${{ matrix.manifest }} > /dev/null

  # The soak-test applications. `platform_commerce` (single-tenant) and
  # `platform_commerce_saas` (multi-tenant) are severed workspaces with
  # a one-of-three backend selector, and they are the only examples that
  # exercise background jobs.
  #
  # This job exists because **nothing else in CI compiles any example.**
  # `bin/examples.sh` is referenced by no workflow, `deny-examples` only
  # scans advisories and `lockfiles` only resolves — so an example can
  # stop building and every check stays green. That is how all eight
  # example lockfiles came to be stale (#1422), a bill this repo has
  # just finished paying.
  #
  # `cargo check`, not `build`: the point is API drift, and check is
  # ~6 minutes across the matrix where build is far longer.
  # `--all-targets` is load-bearing — it pulls in `tests/`, which is
  # where drift actually shows up first.
  platform_examples:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, mysql, sqlite]
    env:
      # One shared target dir across both examples, for the reason
      # bin/examples.sh documents: each example's own target/ is ~1.3 GB.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-examples
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.backend }}
      - name: platform_commerce
        working-directory: crates/rustango/examples/platform_commerce
        run: cargo check --locked --no-default-features --features ${{ matrix.backend }} --all-targets
      - name: platform_commerce_saas
        working-directory: crates/rustango/examples/platform_commerce_saas
        run: cargo check --locked --no-default-features --features ${{ matrix.backend }} --all-targets
      - name: Unit tests (no database needed)
        working-directory: crates/rustango/examples/platform_commerce
        # `--lib --bins`, not `--bins`. Every test in these examples lives
        # under `src/commerce/`, which is reachable only from `src/lib.rs`
        # — neither binary declares `mod commerce` and neither contains a
        # `#[test]`. With `--bins` alone these six steps compiled two
        # empty test binaries and reported `0 passed`, three times over.
        #
        # The tests *were* in the bin target before the examples grew a
        # library (the worker binary needs one to reach the same job
        # types the server dispatches), and this command was not re-run
        # after that move.
        run: cargo test --locked --no-default-features --features ${{ matrix.backend }} --lib --bins
      - name: Unit tests (no database needed) — saas
        working-directory: crates/rustango/examples/platform_commerce_saas
        # `--lib --bins`, not `--bins`. Every test in these examples lives
        # under `src/commerce/`, which is reachable only from `src/lib.rs`
        # — neither binary declares `mod commerce` and neither contains a
        # `#[test]`. With `--bins` alone these six steps compiled two
        # empty test binaries and reported `0 passed`, three times over.
        #
        # The tests *were* in the bin target before the examples grew a
        # library (the worker binary needs one to reach the same job
        # types the server dispatches), and this command was not re-run
        # after that move.
        run: cargo test --locked --no-default-features --features ${{ matrix.backend }} --lib --bins

  # Trivy security scan — the non-bypassable "detect vulnerabilities
  # before releases" gate. Complements `deny` (RustSec advisories) with
  # a broader vuln DB (GHSA), plus committed-secret and IaC/misconfig
  # scanning. The git hooks run the same checks opt-in locally
  # (PRECOMMIT_TRIVY / PREPUSH_TRIVY). Vulns + secrets block on
  # HIGH/CRITICAL (fixable only); misconfig is report-only so a
  # pre-existing finding never silently blocks a release.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version
      - name: Vulnerabilities + secrets (blocking)
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs target \
            --no-progress \
            .
      - name: Misconfigurations (report-only)
        run: |
          trivy fs \
            --scanners misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --skip-dirs target \
            --no-progress \
            .

  # v0.40 tri-dialect litmus — proves a non-PG build of rustango with
  # tenancy still compiles. Catches regressions where PG-only types,
  # bind syntax, or feature wiring leak into the bi/tri-dialect paths.
  # Runs `cargo check`, `cargo clippy`, and the SQLite pragma
  # regression test (foreign_keys ON, WAL on file-backed, busy_timeout
  # set, FK violation rejected — see tests/sqlite_pragmas_live.rs).
  # #1207 — generate each project template and compile it. `templates.rs`
  # claimed CI already did this; nothing did. The crate's unit tests are
  # `.contains()` assertions on template *strings*, and no test ever wrote a
  # project to disk — which is how `--template api` came to generate a project
  # that failed with 75 compiler errors without anything going red.
  #
  # `--ignored` because each case compiles rustango, so `cargo test` stays fast
  # for everyone else. The tests pass `--rustango-path`, so they validate this
  # commit rather than the last published release.
  scaffolded_projects:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: scaffolded-projects
      - run: cargo test -p cargo-rustango --test generated_project_compiles -- --ignored --test-threads=1
      # #1217 — a generated project pins the *published* rustango, so a template
      # may only name features that release actually has. Offline and fast: it
      # compares the emitted feature list against `crates/rustango/Cargo.toml`.
      # The compile test above cannot catch this — it builds with
      # `--rustango-path`, where any new feature exists by definition.
      - run: cargo test -p cargo-rustango --test templates_name_real_features
      # #1345 — `cargo rustango new` with no arguments opens a wizard on a
      # terminal. Off one, it must fail with a message rather than block on a
      # prompt nobody can answer; this job is exactly that caller.
      - run: cargo test -p cargo-rustango --test wizard_cli

  # #1208 — the feature table is a public promise, so check the promise.
  # `sqlite_litmus` below is a single combination, and it happens to be one
  # that *masks* gate gaps: `tenancy` pulls in rand / tower / hmac /
  # async-trait, so modules that use those without gating on them still
  # compiled. Meanwhile `postgres,manage` (what `cargo rustango new
  # --template api` generates) failed with 75 errors, and `sqlite,admin`
  # with 26 — undetected, because nothing built them.
  #
  # Warnings are errors here, unlike the rest of CI: these combinations are
  # exactly where cfg'd-out code leaves unused imports and unconstructed
  # variants behind, and a warning is the only signal that a gate is wrong.
  feature_combos:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - sqlite                       # the bare ORM the manifest advertises
          - postgres
          - mysql
          - postgres,manage              # `cargo rustango new --template api`
          - sqlite,manage
          - sqlite,admin
          - sqlite,manage,admin
          - postgres,manage,admin
          - sqlite,template_views
          - sqlite,tenancy               # the pre-existing litmus
          # The media axis had no entry at all, so a change to the media
          # feature graph was compiled only by `--all-features`, where
          # every optional feature is on and nothing can be observed to
          # be missing. `media` alone gives you `MediaManager`; the REST
          # router is behind `admin`, so both combinations are worth
          # compiling — a file gated on one while using the other is a
          # compile error no other job can reach.
          - sqlite,media
          - sqlite,media,admin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-combos
      - run: cargo check -p rustango --no-default-features --features ${{ matrix.features }}
        env:
          RUSTFLAGS: "-D warnings"
      # Also run the unit tests: `cargo check` misses `#[cfg(test)]` code, and
      # that is exactly where a gate mismatch hides — a test module can outlive
      # the gated item it exercises without the library ever noticing.
      - run: cargo test -p rustango --no-default-features --features ${{ matrix.features }} --lib

  # #1285 — the first Windows coverage this repo has had. Every other job
  # is ubuntu, so a Windows-only bug was structurally uncatchable: #1271
  # (migration duplication on SQLite/Windows) was reported by a user
  # because nothing here could have found it.
  #
  # Cross-compiling does not substitute. It would have compiled #1271
  # perfectly — that class of bug is runtime behaviour, so it takes a real
  # Windows runner. (Nor can a container stand in: Windows containers need
  # a Windows kernel, so there is no local equivalent on macOS or Linux.)
  #
  # SQLite only, and deliberately. GitHub's `services:` containers are
  # Linux-only, so a Windows job cannot stand up Postgres or MySQL. That
  # is no loss here: SQLite is the surface the reported bugs live on.
  #
  # `continue-on-error` while the surface is unproven — this job has never
  # run, and a red-on-arrival required check would block every PR for
  # reasons unrelated to the PR. Drop it once a few runs are green; the
  # job is useless as a gate until then, but its output is not.
  windows_test:
    needs: gate
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rustango --no-default-features --features sqlite,tenancy
      - run: cargo test -p rustango --lib --no-default-features --features sqlite,tenancy
      # Compile every test target before running any, so a Windows-only
      # build break is reported as itself rather than as a missing test.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --no-run
      # The migration suites are the ones that could have caught #1271.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test sqlite_pragmas_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_fk_no_postgres

  sqlite_litmus:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rustango --no-default-features --features sqlite,tenancy
      - run: cargo clippy -p rustango --no-default-features --features sqlite,tenancy --lib --no-deps
      # Compile *every* test target, not just the ones enumerated below
      # (#1363). `check` and `clippy --lib` above both stop at the
      # library, so for a long time no job compiled a test binary
      # without Postgres — and the enumeration grew stale silently every
      # time a test file was added. `--no-run` needs no databases.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --no-run
      # The getting-started example is what the guide's snippets are copied
      # from, and it silently stopped building on SQLite: its manifest let
      # rustango keep its default `postgres` while the example selected
      # `sqlite`, so the derive and the trait bounds disagreed (#1272,
      # #1293). `doc_examples` only ever ran it on Postgres. Compile-only,
      # so no database is needed.
      - name: Getting-started example builds without Postgres
        working-directory: crates/rustango/examples/getting_started_blog
        run: |
          cargo build --locked --no-default-features --features sqlite
          # Every test target, not just one — the admin and middleware
          # tests were the ones still naming a driver, and a single
          # named test would not have caught them.
          cargo test --locked --no-default-features --features sqlite --no-run
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test sqlite_pragmas_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_fk_no_postgres
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_choices
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test auth_signals
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_cursor_pagination_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_limit_offset_pagination_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_filter_backend_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_throttle_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_db_comment
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_verbose_name
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_meta_verbose_name
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_editable
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_blank
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_search_filter_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_ordering_filter_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test assert_num_queries_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_validators
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test got_request_exception_signal
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test migrate_signals_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,passkey --test passkey_store_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_reverse
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_contains
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test m2m_changed_signal_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,config,email --test setting_changed_signal
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_ipaddress_field
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_filepath_field
      # Audit retention now sweeps the registry's own log, not just tenants.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test audit_cleanup_sqlite_live
      # #1344 — the hostname verbs, and that they write the table the
      # operator console writes rather than a parallel one.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test manage_hosts_sqlite_live
      # #1344 — and that the CLI enforces the same operator lockout rules the
      # console does, now that both call one engine.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test manage_operators_sqlite_live
      # #1344 — run history and the audit trail, printable without a browser,
      # including that a CLI provision is recorded at all.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test manage_inspect_sqlite_live
      # #1344 — tenant routing config, editable without a browser, and the
      # cache/pool invalidation that has to follow the write.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test manage_edit_tenant_sqlite_live
      # The operator console and the provisioning engines under it. These ran
      # only in the all-features job, which always has Postgres available —
      # so a PG-ism in the console (a `::`-cast, an `ON CONFLICT` spelling,
      # `SET search_path`) would pass CI and break every SQLite/MySQL
      # deployment. This job is the one that would have caught it.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_provisioning_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_operators_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_hosts_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_audit_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_migrate_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_decommission_sqlite_live
      # #1341 — pre-warming pools from the console, which was CLI-only.
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test operator_console_prewarm_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test provision_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test provision_store_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,testkit --test org_hosts_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,testkit --test tenant_sweep_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test serializer_cross_validate
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_none
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_exclude_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test sqlmigrate
      # #1273 — derive(ViewSet) must compile with no postgres feature.
      - run: cargo test -p rustango --no-default-features --features sqlite,admin --test viewset_derive_pool_tridialect_compile --no-run
      - run: cargo test -p rustango --no-default-features --features mysql,admin --test viewset_derive_pool_tridialect_compile --no-run
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_set_ops
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test set_algebra_emission
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test migrate_runpython_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test positive_int_field
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_dates
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,config,email --test mail_admins_managers
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,admin --test admin_list_select_related_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test form_clean_methods
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test unique_together_validator
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test m2m_through_model
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,passwords,auth_flows --test password_reset_confirm
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,cache,config --test file_cache_backend
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test factories
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,config,email --test file_email_backend
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,cache,sessions --test file_backed_sessions
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,template_views --test template_view
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test locale_middleware
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,notifications,http-client --test slack_notification
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test databases_using_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test database_routers_sqlite_live

  # Per-dialect SQLite live suite — runs every `_sqlite_live.rs` file
  # explicitly under `--no-default-features --features sqlite,...`. This
  # is the SQLite parallel to `mysql_live` + `postgres_test`, and it
  # exercises rustango's tri-dialect surface from the SQLite side
  # without inheriting the PG/MySQL feature flags that
  # `postgres_test --all-features` does. SQLite is embedded so no
  # service container is needed; tests create per-test files / `:memory:`
  # databases.
  #
  # `--test` files are listed explicitly because this job *runs* them,
  # and only the sqlite-live ones are worth running here. It is no
  # longer a workaround for test binaries that would not compile: since
  # #1363 the whole suite compiles under `--no-default-features`, and
  # `sqlite_litmus` asserts that with `--no-run`.
  sqlite_live:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p rustango \
            --no-default-features \
            --features sqlite,tenancy,admin,jobs-postgres,media,passwords,serializer,totp,testkit \
            --test access_admin_codename_sqlite_live \
            --test admin_sqlite_live \
            --test admin_list_display_links_sqlite_live \
            --test admin_search_help_text_sqlite_live \
            --test admin_actions_position_sqlite_live \
            --test admin_date_hierarchy_sqlite_live \
            --test admin_docs_sqlite_live \
            --test admin_prepopulated_sqlite_live \
            --test admin_raw_id_fields_sqlite_live \
            --test admin_autocomplete_sqlite_live \
            --test admin_save_hook_sqlite_live \
            --test admin_recent_actions_sqlite_live \
            --test admin_simple_list_filter_sqlite_live \
            --test admin_list_display_jsonpath_sqlite_live \
            --test audit_pool_sqlite_live \
            --test bulk_update_api_sqlite_live \
            --test bulk_upsert_tri \
            --test count_distinct_sqlite_live \
            --test database_pools_sqlite_file_live \
            --test database_pools_sqlite_live \
            --test database_tenant_sqlite_live \
            --test explain_pool_tri \
            --test first_last_sqlite_live \
            --test fixtures_sqlite_live \
            --test foreign_key_sqlite_live \
            --test funcs_batch1_sqlite_live \
            --test funcs_batch2_sqlite_live \
            --test get_or_create_sqlite_live \
            --test i18n_admin_editor_sqlite_live \
            --test i18n_db_overrides_sqlite_live \
            --test inspectdb_sqlite_live \
            --test inspectdb_views_sqlite_live \
            --test jobs_sqlite_live \
            --test json_path_tri \
            --test lock_sqlite_warning \
            --test m2m_sqlite_live \
            --test media_sqlite_live \
            --test migrate_registry_pool_sqlite_live \
            --test orm_advanced_sqlite_live \
            --test permissions_sqlite_live \
            --test prefetch_filtered_sqlite_live \
            --test row_to_json_pool_sqlite_live \
            --test sqlite_pragmas_live \
            --test tenancy_manage_sqlite_live \
            --test tenant_auth_sqlite_live \
            --test tenant_extractor_sqlite_live \
            --test tenant_pools_sqlite_live \
            --test tx_methods_sqlite_live \
            --test unique_when_sqlite_live \
            --test viewset_sqlite_live \
            --test admin_totp_2fa_sqlite_live \
            --test admin_totp_2fa_e2e \
            --test django6_aggregation \
            --test django6_subquery \
            --test django6_window \
            --test django6_joins \
            --test django6_setops \
            --test django6_json_dates \
            --test django6_writes \
            --test django6_delta

  # Redis live suite. `cache-redis` is off by default, so until #1280
  # there was no Redis service here at all and nothing exercised
  # `RedisCache` — which is how `incr` shipped using `EXPIRE … NX`, a
  # Redis 7.0+ form. On 6.x every call errored, and both callers fail
  # open, so rate limiting and account lockout silently did nothing.
  #
  # The matrix is the point: run the SAME suite against 6 and 7. A
  # 7-only job passes on the broken code and proves nothing.
  redis_live:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["6", "7"]
    services:
      redis:
        # AWS Public ECR mirror — same Docker Hub rate-limit reason as
        # the `postgres_test` / `mysql_live` services.
        image: public.ecr.aws/docker/library/redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustango --features cache,cache-redis --test cache_redis_incr_live
      - run: cargo test -p rustango --features cache,cache-redis --test cache_redis_prefix_live

  # The S3 live suites gate on `RUSTANGO_S3_TEST_*`, which appeared
  # nowhere in `.github/` and were `#[ignore]`d nowhere either — so they
  # ran inside `cargo test --workspace --all-features` and were counted
  # green on every build without touching an S3 server (#1437).
  # `s3_live_presign` went from "3 passed in 0.00s" to 3.03s once a real
  # endpoint existed, which is the whole bug in one line.
  #
  # MinIO is started as a step rather than a `services:` container: the
  # image needs `server /data` as its command, which `services:` cannot
  # supply.
  #
  # Pulled from quay.io, not Docker Hub — an unauthenticated runner gets
  # "pull access denied for minio/minio" there. Same rate-limit reason
  # the Postgres/MySQL/Redis services use the AWS ECR mirror, but MinIO
  # is not an official library image so that mirror has no copy; quay is
  # MinIO's own registry.
  s3_live:
    needs: gate
    runs-on: ubuntu-latest
    services:
      # The media suites store rows in `rustango_media` alongside the
      # bucket, so they need both halves.
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: rustango
          POSTGRES_PASSWORD: rustango
          POSTGRES_DB: rustango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustango -d rustango_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      # The media suites need both halves; this job runs the Postgres
      # service above, so it is one of the places the URL is true.
      DATABASE_URL: postgres://rustango:rustango@localhost:5432/rustango_test
      RUSTANGO_S3_TEST_ENDPOINT: http://127.0.0.1:9100
      RUSTANGO_S3_TEST_BUCKET: rustango-test
      RUSTANGO_S3_TEST_KEY: rustango
      RUSTANGO_S3_TEST_SECRET: rustango123
      RUSTANGO_S3_TEST_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=$RUSTANGO_S3_TEST_KEY \
            -e MINIO_ROOT_PASSWORD=$RUSTANGO_S3_TEST_SECRET \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9100/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host \
            -e MC_HOST_m=http://$RUSTANGO_S3_TEST_KEY:$RUSTANGO_S3_TEST_SECRET@127.0.0.1:9100 \
            quay.io/minio/mc:latest mb --ignore-existing m/$RUSTANGO_S3_TEST_BUCKET
      - run: cargo test -p rustango --features postgres --test s3_live_presign
      # These 22 were the ones that exposed #1450 the first time they ran
      # against a real database. `--test-threads=1`: the setup helper
      # truncates the shared media tables, so they must not overlap.
      - run: >-
          cargo test -p rustango --features postgres,media,testkit
          --test media_live -- --test-threads=1
      - run: >-
          cargo test -p rustango --features postgres,media,testkit
          --test media_collections_tags_live -- --test-threads=1

  # v0.41 MySQL parity — the marketing claim is tri-dialect end-to-end
  # since v0.38, but every MySQL `_live.rs` test was skipped silently
  # in CI because `MYSQL_TEST_URL` was never set. This job runs the
  # MySQL live suite against a real MySQL 8.0 service. Catches the
  # class of bug we just hit: MySQL-clause-order syntax errors in
  # query strings that PG/SQLite accept (e.g. `LIMIT` vs `FOR UPDATE
  # SKIP LOCKED` order in v0.38's jobs pickup).
  mysql_live:
    needs: gate
    runs-on: ubuntu-latest
    services:
      mysql:
        # See `postgres_test`'s comment — same reason for the
        # AWS Public ECR mirror.
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rustango
          MYSQL_DATABASE: rustango_test
          MYSQL_USER: rustango
          MYSQL_PASSWORD: rustango
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u rustango -prustango"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      MYSQL_TEST_URL: mysql://rustango:rustango@127.0.0.1:3306/rustango_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustango --features mysql,jobs-postgres --test jobs_mysql_live
      - run: cargo test -p rustango --features mysql --test mysql_live
      # Again under --all-features. #1277: MySQL enforces FKs and has no
      # `DROP TABLE … CASCADE`, so `drop_all_pool` failed whenever it dropped
      # a parent (`rustango_users`) before its child (`rustango_api_keys`).
      # Which order that walk takes depends on how many models are registered,
      # so only a full-feature build reliably provokes it — the bare
      # `--features mysql` run above never did, which is why this went
      # unnoticed. Keep both: the narrow run guards the common config, this
      # one guards the FK-ordering regression.
      - run: cargo test -p rustango --all-features --test mysql_live
      - run: cargo test -p rustango --features mysql,testkit --test explain_pool_tri
      - run: cargo test -p rustango --features mysql,testkit --test bulk_upsert_tri
      # #1461 — the rest of the tri-dialect suites. A `_tri` file runs its
      # PostgreSQL and SQLite arms for free in `postgres_test`, so a
      # missing line here costs only the MySQL arm and the suite still
      # looks covered. These three shipped that way;
      # `every_live_suite_runs_in_ci` now fails when a `*_tri` or
      # `*_mysql_live` target is absent from this job.
      - run: cargo test -p rustango --features mysql,testkit --test values_tri
      - run: cargo test -p rustango --features mysql,testkit --test regex_tri
      - run: cargo test -p rustango --features mysql,testkit --test testkit_matrix_forms_tri
      # #559 — dropping a CHECK or a composite FK. MySQL takes no
      # `IF EXISTS` on either, so this is the arm that was failing with
      # error 1064 while the emission tests stayed green.
      - run: cargo test -p rustango --features mysql,testkit --test migrate_ddl_tri
      # The media tag surface had no MySQL coverage at all — `media_live`
      # and `media_collections_tags_live` are PostgreSQL-typed and
      # `media_sqlite_live` is SQLite, so `tag`'s `INSERT IGNORE` branch
      # and `tags_for_many`'s positional-`?` `IN (…)` had never executed
      # on this backend. `--test-threads=1`: every test drops and
      # rebuilds the shared `rustango_media*` tables.
      - run: >-
          cargo test -p rustango --features mysql,media,testkit
          --test media_tags_mysql_live -- --test-threads=1
      # #1403 — bulk create must roll back on a constraint violation.
      # `--all-features` so the MySQL arm of the tri-dialect guard is
      # compiled in; the sqlite arm runs everywhere, this is the one that
      # needs a server.
      - run: cargo test -p rustango --all-features --test viewset_bulk_create_is_atomic
      # A second database for tenancy to provision *into*. The service
      # grants `rustango` rights on `rustango_test` only, so the test
      # cannot create this itself; and provisioning refuses a tenant
      # pointed at the registry's own database, which is what the test
      # used to do.
      - name: Create the tenant database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -prustango -e "
            CREATE DATABASE IF NOT EXISTS rustango_tenant_test;
            GRANT ALL PRIVILEGES ON rustango_tenant_test.* TO 'rustango'@'%';
            FLUSH PRIVILEGES;"
      - run: cargo test -p rustango --features mysql,tenancy --test tenancy_manage_mysql_live
      - run: cargo test -p rustango --features mysql,tenancy,testkit --test permissions_mysql_live
      - run: cargo test -p rustango --features mysql,tenancy,testkit --test database_pools_mysql_live
      # #1461 — these two were written, committed, and then run by no
      # workflow at all. MySQL is the strict dialect for migrations: a
      # re-run `CREATE TABLE` is error 1050 and `ALTER` rejects shapes
      # PG accepts, so a broken reconcile bites here first and nowhere
      # else. `every_live_suite_runs_in_ci` now fails if a
      # `tests/*_mysql_live.rs` is missing from this list.
      - run: cargo test -p rustango --features mysql,tenancy --test migrate_fake_initial_mysql_live
      - run: cargo test -p rustango --features mysql,tenancy --test migrate_reconcile_mysql_live
      # `--features mysql` alone: this suite needs no tenancy, and the
      # narrower set is the honest one. MySQL is the only dialect that
      # needs the table on DROP INDEX and the only one that rejects
      # `IF EXISTS` there, so a render-only test elsewhere proves
      # nothing about it (#1588).
      - run: cargo test -p rustango --features mysql --test migrate_drop_index_mysql_live
      # The partial-apply state only exists on MySQL: PostgreSQL and
      # SQLite roll a failed migration back completely, so neither can
      # reach "schema moved, ledger did not" (#1588).
      - run: cargo test -p rustango --features mysql --test migrate_partial_apply_mysql_live
      # #1281 — the MySQL arm of DatabaseCache::add is bespoke SQL
      # (INSERT IGNORE + conditional UPDATE, since ON DUPLICATE KEY
      # UPDATE takes no WHERE). It is also positional-`?`, so a bind
      # ordering that Postgres' numbered `$n` tolerates breaks here.
      #
      # `--no-default-features` matters: the default set includes
      # `postgres`, which would compile this file's Postgres case into a
      # job that runs no Postgres service. `DATABASE_URL` is defined
      # workflow-wide, so that case would find the variable set, dial a
      # server that is not there, and spend 30s timing out. The test
      # skips unreachable backends rather than failing, but not building
      # the arm at all is both faster and more honest about what this
      # job covers. Postgres is exercised by `postgres_test`.
      - run: cargo test -p rustango --no-default-features --features mysql,cache --test cache_db_backend_add_live
      - run: cargo test -p rustango --features mysql,tenancy,mcp,testkit --test mcp_user_keys_mysql_live
      - run: cargo test -p rustango --features mysql --test audit_mysql_live
      - run: cargo test -p rustango --features mysql --test fixtures_mysql_live
      - run: cargo test -p rustango --features mysql --test inspectdb_mysql_live
      - run: cargo test -p rustango --features mysql --test funcs_batch1_mysql_live
      - run: cargo test -p rustango --features mysql,testkit --test json_path_tri
      # Django 6.0 ORM parity execution-verification suite (audit §26).
      # Shared scenario bodies; the mysql cfg-mod runs here, the sqlite
      # and PG mods are compiled out.
      #
      # `--no-default-features` for the same reason as the cache test
      # above, and these are where it actually cost something (#1435).
      # `DATABASE_URL` is defined workflow-wide, so with the default
      # feature set each of these eight compiled its PG arm in, found
      # the variable set, dialled a Postgres this job does not run, and
      # spent ~240s timing out — ~32 minutes per CI run, for eight
      # suites that then reported green having connected to nothing.
      #
      # Verified against a real MySQL 8.0 before changing: all eight
      # build and pass under `--no-default-features --features mysql`,
      # same test counts, in under a second each.
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_aggregation
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_subquery
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_window
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_joins
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_setops
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_json_dates
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_writes
      - run: cargo test -p rustango --no-default-features --features mysql --test django6_delta

  # PostGIS geometry live suite (#443). The regular `postgres_test` runs
  # against `pgvector/pgvector:pg16`, which has no PostGIS, so the
  # geometry round-trip test there skips (CREATE EXTENSION postgis fails →
  # graceful skip). This job runs `postgis/postgis:16-3.4` so the
  # `Point` column EWKB encode/decode is exercised end-to-end against a
  # real PostGIS. Like pgvector, the postgis image is a Docker Hub user-
  # namespace image (not on the AWS ECR `library/` mirror), so it's
  # pulled straight from Docker Hub.
  postgis_live:
    needs: gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rustango
          POSTGRES_PASSWORD: rustango
          POSTGRES_DB: rustango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustango -d rustango_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rustango:rustango@127.0.0.1:5432/rustango_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustango --features postgres,tenancy --test gis_geometry_postgis_live
      - run: cargo test -p rustango --features postgres,tenancy --test gis_spatial_queries_postgis_live

  # End-to-end playwright suite for the multi-app rustango showcase.
  # The showcase is a severed workspace under examples/showcase/ that
  # exercises every framework surface (admin, viewsets, forms, auth,
  # i18n, …) as phases land. Phase 1 (current) just smoke-tests the
  # info endpoint to validate the boot + migrate + runserver chain
  # works against each backend.
  #
  # Matrix runs each backend once. The showcase Cargo.toml has a
  # one-of-three backend feature selector; the matrix flips it per
  # row so the binary's `runserver` picks the right Pool constructor.
  e2e:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            database_url: postgres://rustango:rustango@127.0.0.1:5432/showcase
            service_image: public.ecr.aws/docker/library/postgres:16-alpine
          - backend: mysql
            database_url: mysql://rustango:rustango@127.0.0.1:3306/showcase
            service_image: public.ecr.aws/docker/library/mysql:8
          - backend: sqlite
            database_url: sqlite:///tmp/rustango-showcase-e2e.db
            service_image: ''
    services:
      # See `postgres_test`'s comment for the AWS Public ECR mirror
      # rationale (CI Docker Hub timeouts after PR #848 / #866).
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'public.ecr.aws/docker/library/postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: rustango
          POSTGRES_PASSWORD: rustango
          POSTGRES_DB: showcase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rustango -d showcase"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      mysql:
        image: ${{ matrix.backend == 'mysql' && 'public.ecr.aws/docker/library/mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: rustango
          MYSQL_USER: rustango
          MYSQL_PASSWORD: rustango
          MYSQL_DATABASE: showcase
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -prustango"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.backend }}
          workspaces: examples/showcase
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-build showcase server
        working-directory: examples/showcase
        run: cargo build --locked --no-default-features --features ${{ matrix.backend }}
      - name: Install playwright + chromium
        working-directory: examples/showcase/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run playwright suite
        working-directory: examples/showcase/e2e
        env:
          SHOWCASE_BACKEND: ${{ matrix.backend }}
          DATABASE_URL: ${{ matrix.database_url }}
          CI: '1'
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.backend }}
          path: examples/showcase/e2e/playwright-report

  # Runnable documentation examples — keep docs/getting-started.md and
  # docs/orm.md in sync with the framework. Each example is a severed
  # workspace under crates/rustango/examples/ whose integration tests run
  # against a real Postgres. A failure here means a code block in the
  # guides no longer matches the API (exactly the `fetch_pool` → `fetch`
  # class of drift these examples were added to catch).
  #
  # getting_started_blog runs `migrate` first to create its schema;
  # orm_cookbook resets the `public` schema inside the test itself.
  doc_examples:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: getting_started_blog
            migrate: true
          - example: orm_cookbook
            migrate: false
          # The 16-chapter COOKBOOK.md example. Chapters manage their own
          # DB setup (reset/migrate per test), so migrate: false like
          # orm_cookbook. Gated here so it can't silently bit-rot (#1124).
          # `--test-threads=1`: the chapters create/reset tables in the
          # shared `public` schema, so they must run serially (as every
          # chapter's doc comment already documents) — parallel DDL races
          # on `pg_class`/`pg_type`.
          - example: cookbook_blog
            migrate: false
            test_args: "-- --test-threads=1"
          - example: admin_demo
            migrate: true
          # Authentication deep-dive docs (docs/auth-*.md). `migrate: false` for
          # now — the current flow tests (passwords, sessions) are pure /
          # in-memory; flips to true once DB-backed flow tests land.
          - example: auth_demo
            migrate: false
    services:
      # See `postgres_test`'s comment for the AWS Public ECR mirror
      # rationale (CI Docker Hub timeouts after PR #848 / #866).
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: rustango
          POSTGRES_PASSWORD: rustango
          POSTGRES_DB: rustango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustango -d rustango_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rustango:rustango@localhost:5432/rustango_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-example-${{ matrix.example }}
          workspaces: crates/rustango/examples/${{ matrix.example }}
      - name: Create schema (migrate)
        if: ${{ matrix.migrate }}
        working-directory: crates/rustango/examples/${{ matrix.example }}
        run: cargo run --locked -- migrate
      # `--locked` is the point of committing these lockfiles: a bad
      # upstream release is then handled when we choose to bump, not at
      # the moment it lands (#1422).
      - name: Test
        working-directory: crates/rustango/examples/${{ matrix.example }}
        run: cargo test --locked ${{ matrix.test_args }}
