name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # v0.30.23 — dropped global `RUSTFLAGS: "-D warnings"`. It was
  # promoting every clippy + test warning (812 in clippy, dead-code
  # in test fixtures, etc.) to a build error. The matching local
  # pre-push hook treats warnings as warnings; CI now does the
  # same. Real type errors / broken tests still fail the build.
  DATABASE_URL: postgres://rustango:rustango@localhost:5432/rustango_test

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # v0.30.22 — aligned with the local pre-push hook
      # (see .githooks/pre-push). Pre-v0.30.22 CI ran the
      # `--workspace --all-targets -- -D warnings` form which
      # surfaced ~70 clippy::pedantic errors on the macros crate
      # (doc_markdown, too_many_lines, items_after_statements)
      # that the pre-push hook treats as warnings only. Real
      # errors still surface in the `postgres_test` job via rustc.
      - run: cargo clippy -p rustango --features tenancy --lib --no-deps

  # Primary PG test job — runs the full workspace with `--all-features`
  # against a real PostgreSQL service. Covers every PG-typed live test
  # (`*_live.rs`, `admin_live.rs`, `audit_live.rs`, `branding_live.rs`,
  # `jobs_pg_live.rs`, etc.) plus every unit test. Renamed from `test`
  # so each dialect has an explicitly-named job: `postgres_test`,
  # `mysql_live`, `sqlite_live`.
  postgres_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rustango
          POSTGRES_PASSWORD: rustango
          POSTGRES_DB: rustango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustango -d rustango_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      # The all-features workspace build (postgres + mysql + sqlite +
      # tenancy + admin + jobs-* + ...) produces a lot of test binaries
      # and outgrew the runner's default 14 GB free disk. Free the
      # pre-installed Android SDK / .NET / Haskell / large Docker
      # images to reclaim ~25 GB before linking starts.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # v0.30.22 — dropped `RUSTDOCFLAGS=-D warnings` because the
      # vast majority of warnings are stylistic (bare URLs in
      # comments, `<T>` parsed as HTML tags by rustdoc, missing
      # backticks around generic types). Real broken intra-doc
      # links and parse errors still surface as build failures.
      - run: cargo doc --workspace --no-deps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # v0.40 tri-dialect litmus — proves a non-PG build of rustango with
  # tenancy still compiles. Catches regressions where PG-only types,
  # bind syntax, or feature wiring leak into the bi/tri-dialect paths.
  # Runs `cargo check`, `cargo clippy`, and the SQLite pragma
  # regression test (foreign_keys ON, WAL on file-backed, busy_timeout
  # set, FK violation rejected — see tests/sqlite_pragmas_live.rs).
  sqlite_litmus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rustango --no-default-features --features sqlite,tenancy
      - run: cargo clippy -p rustango --no-default-features --features sqlite,tenancy --lib --no-deps
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test sqlite_pragmas_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_fk_no_postgres
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_choices
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test auth_signals
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_cursor_pagination_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_db_comment
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_verbose_name
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_meta_verbose_name
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_editable
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_blank
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_search_filter_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test viewset_ordering_filter_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test assert_num_queries_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_validators
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test got_request_exception_signal
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test migrate_signals_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_reverse
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_contains
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test m2m_changed_signal_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,config,email --test setting_changed_signal
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_ipaddress_field
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test macro_filepath_field
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test serializer_cross_validate
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_none
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test sqlmigrate
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_set_ops
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test set_algebra_emission
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test migrate_runpython_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test positive_int_field
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test queryset_dates
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,config,email --test mail_admins_managers
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,admin --test admin_list_select_related_sqlite_live
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test form_clean_methods
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy,serializer --test unique_together_validator
      - run: cargo test -p rustango --no-default-features --features sqlite,tenancy --test m2m_through_model

  # Per-dialect SQLite live suite — runs every `_sqlite_live.rs` file
  # explicitly under `--no-default-features --features sqlite,...`. This
  # is the SQLite parallel to `mysql_live` + `postgres_test`, and it
  # exercises rustango's tri-dialect surface from the SQLite side
  # without inheriting the PG/MySQL feature flags that
  # `postgres_test --all-features` does. SQLite is embedded so no
  # service container is needed; tests create per-test files / `:memory:`
  # databases.
  #
  # Listing `--test` files explicitly prevents the test harness from
  # compiling PG-typed test binaries that don't compile under
  # `--no-default-features`.
  sqlite_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p rustango \
            --no-default-features \
            --features sqlite,tenancy,admin,jobs-postgres,media,passwords,serializer \
            --test access_admin_codename_sqlite_live \
            --test admin_sqlite_live \
            --test admin_list_display_links_sqlite_live \
            --test admin_search_help_text_sqlite_live \
            --test admin_actions_position_sqlite_live \
            --test admin_date_hierarchy_sqlite_live \
            --test admin_prepopulated_sqlite_live \
            --test admin_raw_id_fields_sqlite_live \
            --test admin_autocomplete_sqlite_live \
            --test admin_save_hook_sqlite_live \
            --test admin_recent_actions_sqlite_live \
            --test admin_simple_list_filter_sqlite_live \
            --test admin_list_display_jsonpath_sqlite_live \
            --test audit_pool_sqlite_live \
            --test bulk_upsert_sqlite_live \
            --test count_distinct_sqlite_live \
            --test database_pools_sqlite_file_live \
            --test database_pools_sqlite_live \
            --test database_tenant_sqlite_live \
            --test explain_pool_sqlite_live \
            --test first_last_sqlite_live \
            --test fixtures_sqlite_live \
            --test foreign_key_sqlite_live \
            --test funcs_batch1_sqlite_live \
            --test funcs_batch2_sqlite_live \
            --test get_or_create_sqlite_live \
            --test inspectdb_sqlite_live \
            --test inspectdb_views_sqlite_live \
            --test jobs_sqlite_live \
            --test json_path_sqlite_live \
            --test lock_sqlite_warning \
            --test m2m_sqlite_live \
            --test media_sqlite_live \
            --test migrate_registry_pool_sqlite_live \
            --test orm_advanced_sqlite_live \
            --test permissions_sqlite_live \
            --test prefetch_filtered_sqlite_live \
            --test row_to_json_pool_sqlite_live \
            --test sqlite_pragmas_live \
            --test tenancy_manage_sqlite_live \
            --test tenant_auth_sqlite_live \
            --test tenant_extractor_sqlite_live \
            --test tenant_pools_sqlite_live \
            --test tx_methods_sqlite_live \
            --test unique_when_sqlite_live \
            --test viewset_sqlite_live

  # v0.41 MySQL parity — the marketing claim is tri-dialect end-to-end
  # since v0.38, but every MySQL `_live.rs` test was skipped silently
  # in CI because `MYSQL_TEST_URL` was never set. This job runs the
  # MySQL live suite against a real MySQL 8.0 service. Catches the
  # class of bug we just hit: MySQL-clause-order syntax errors in
  # query strings that PG/SQLite accept (e.g. `LIMIT` vs `FOR UPDATE
  # SKIP LOCKED` order in v0.38's jobs pickup).
  mysql_live:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rustango
          MYSQL_DATABASE: rustango_test
          MYSQL_USER: rustango
          MYSQL_PASSWORD: rustango
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u rustango -prustango"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      MYSQL_TEST_URL: mysql://rustango:rustango@127.0.0.1:3306/rustango_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustango --features mysql,jobs-postgres --test jobs_mysql_live
      - run: cargo test -p rustango --features mysql --test mysql_live
      - run: cargo test -p rustango --features mysql --test explain_pool_mysql_live
      - run: cargo test -p rustango --features mysql --test bulk_upsert_mysql_live
      - run: cargo test -p rustango --features mysql,tenancy --test tenancy_manage_mysql_live
      - run: cargo test -p rustango --features mysql,tenancy --test permissions_mysql_live
      - run: cargo test -p rustango --features mysql,tenancy --test database_pools_mysql_live
