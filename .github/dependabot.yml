# Monthly, one PR per ecosystem, at most two open: each PR runs the full
# CI matrix. Major bumps are planned by hand (they need code changes and
# must keep the Rust 1.88 floor), so they are ignored here.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
