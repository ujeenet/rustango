# cargo-deny configuration. Run `cargo deny check` in CI.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# v0.30.22 — RUSTSEC-2023-0071 (Marvin Attack on rsa v0.9.x)
# is unfixable from our side: the only consumer is sqlx-mysql,
# and no safe upgrade exists upstream. The mysql backend is
# opt-in (cargo feature, not default), so projects that don't
# enable it never link rsa. Track upstream:
# https://github.com/RustCrypto/RSA/issues/626
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # v0.30.22 — CDLA-Permissive-2.0 is the license on
    # `webpki-roots` (TLS root certificate bundle). It's an
    # OSI-tracked permissive license; allowed to keep
    # `--all-features` builds lint-clean.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # 0BSD is the "Zero-Clause BSD" (Free Public License 1.0.0) —
    # effectively public domain with no restrictions. Added for
    # `quoted_printable` (v0.5.2), a transitive dep of `lettre`
    # (the SMTP transport added in PR #94 / issue #48).
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
