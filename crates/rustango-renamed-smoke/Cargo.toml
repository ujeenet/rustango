[package]
name = "rustango-renamed-smoke"
version = "0.0.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Smoke test for #142 — confirms #[derive(Model)] compiles when the rustango crate is renamed via the consumer's Cargo.toml `package = \"rustango\"` field."

[lints]
workspace = true

[lib]
name = "rustango_renamed_smoke"
path = "src/lib.rs"

# Mirror rustango's feature gates locally. The derive macro emits
# `#[cfg(feature = "X")]` against the CONSUMER's feature flags, so
# the smoke crate has to declare a matching `postgres` feature that
# forwards to `orm/postgres` — otherwise the cfg-gated
# `impl LoadRelated for #StructName` / `impl MaybePgFromRow for ...`
# emissions silently get dropped, the trait bounds elsewhere go
# unsatisfied, and `cargo check --workspace` fails.
[features]
default = ["postgres", "serializer", "forms", "admin", "tenancy"]
postgres = ["orm/postgres"]
serializer = ["orm/serializer"]
forms = ["orm/forms"]
admin = ["orm/admin"]
tenancy = ["orm/tenancy"]

[dependencies]
# The whole point of this crate — rename rustango locally so the
# macro must resolve its emit paths through `proc-macro-crate`.
# Use rustango's default features (postgres + admin + tenancy +
# etc.) so the dep graph is complete; the smoke crate's own
# `postgres` feature is just for matching the macro's cfg-gates.
#
# This crate intentionally declares ZERO direct deps on
# `serde` / `serde_json` / `tracing` — every macro emit that used
# to need them now routes through `rustango::__serde` /
# `__serde_json` / `__tracing` (#142 follow-up). If a regression
# re-introduces a hardcoded `::serde::...` etc. emit, this
# crate's build will break, which is the whole point of keeping
# it here.
#
# Still on the list as direct deps:
# - `chrono` — referenced in user-typed struct fields
#   (`pub created_at: chrono::DateTime<chrono::Utc>`); not just
#   macro-emitted. Real apps using DateTime columns need chrono
#   as a direct dep anyway. The macro-side `__chrono` re-export
#   still removes the dep requirement when the user only uses
#   chrono via the macro's `auto_now` write paths.
# - `sqlx` — still emitted as `#root::sql::sqlx::...` so routed
#   through orm — no direct dep needed.
# - `uuid` — routed through `__uuid` — no direct dep needed.
# - `rust_decimal` — 1 site; not yet routed (future follow-up).
orm = { package = "rustango", path = "../rustango", version = "0.53.0" }
chrono = { workspace = true }
