[package]
name = "rustango-tenancy"
description = "Multi-tenancy for rustango: Org registry, resolvers, tenant pools, scoped migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Depend on the facade so `#[derive(Model)]`'s emitted
# `::rustango::core` / `::rustango::sql` paths resolve. The facade
# does NOT re-export rustango-tenancy (cycle would form), so users
# pulling in tenancy add `rustango-tenancy` separately.
rustango       = { workspace = true }
chrono         = { workspace = true }
serde          = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
async-trait    = { workspace = true }
http           = { workspace = true }
tokio          = { workspace = true }
axum           = { workspace = true }
tower          = { workspace = true }
http-body-util = { workspace = true }
argon2         = { workspace = true }
password-hash  = { workspace = true }
base64         = { workspace = true }
hmac           = { workspace = true }
sha2           = { workspace = true }
subtle         = { workspace = true }
cookie         = { workspace = true }
rand           = { workspace = true }
tera           = { workspace = true }
serde_json     = { workspace = true }
rpassword      = { workspace = true }

[dev-dependencies]
serde_json         = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono             = { workspace = true }
# Example-only: tenancy_manage CLI auto-loads `.env` so DATABASE_URL
# / RUSTANGO_APEX_DOMAIN don't have to be re-exported each session.
dotenvy            = { workspace = true }
