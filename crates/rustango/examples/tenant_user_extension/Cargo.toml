[package]
name = "tenant_user_extension"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone — sever from the parent workspace so this can ship as a
# self-contained example anyone can `cargo build` after copying out.
[workspace]

[lib]
name = "tenant_user_extension"
path = "src/lib.rs"

[[bin]]
name = "tenant_user_extension"
path = "src/main.rs"

[dependencies]
rustango = { path = "../..", default-features = false, features = [
    "postgres", "manage", "tenancy", "runtime", "serializer", "forms",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
