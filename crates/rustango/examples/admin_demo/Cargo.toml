[package]
name = "admin_demo"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone — severs from the parent workspace so it builds as a self-contained
# example. Companion to docs/admin.md.
[workspace]

[lib]
name = "admin_demo"
path = "src/lib.rs"

[[bin]]
name = "admin_demo"
path = "src/main.rs"

[dependencies]
# In-repo example → path dep on the framework. Default features include the
# admin + audit; a real project uses `rustango = "0.43"` from crates.io.
rustango = { path = "../.." }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# `#[derive(Model)]` impls are cfg-gated on THIS crate's `postgres` feature.
[features]
default = ["postgres"]
postgres = ["rustango/postgres"]
