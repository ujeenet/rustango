[package]
name = "mcp_demo"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone — severs from the parent workspace so this builds as a
# self-contained example anyone can copy out and `cargo run`. It is the
# live server behind `docs/mcp.md`.
#
# Note: built WITHOUT the `postgres` feature on purpose — that makes the
# framework's `DefaultTenantDb` resolve to SQLite, so the MCP handlers'
# `Tenant` extractor reads the `TenantContext<Sqlite>` this demo injects.
[workspace]

[[bin]]
name = "mcp_demo"
path = "src/main.rs"

[dependencies]
# In-repo example → path dep on the framework. A real project uses
# `rustango = { version = "0.43", features = ["mcp", "sqlite"] }` instead.
rustango = { path = "../..", default-features = false, features = ["mcp", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
