[package]
name = "orm_cookbook"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone — severs from the parent workspace so it builds as a
# self-contained example. Backs docs/orm.md: every recipe verified here
# runs against a real Postgres in tests/orm_smoke.rs.
[workspace]

[lib]
name = "orm_cookbook"
path = "src/lib.rs"

[dependencies]
# In-repo example → path dep on the framework.
rustango = { path = "../.." }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The `#[derive(Model)]` impls are `#[cfg(feature = "postgres")]`-gated
# on THIS crate, so a backend feature must be enabled here.
[features]
default = ["postgres"]
postgres = ["rustango/postgres"]
sqlite = ["rustango/sqlite"]
mysql = ["rustango/mysql"]
