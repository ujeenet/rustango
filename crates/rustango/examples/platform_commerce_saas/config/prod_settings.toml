# platform_commerce_saas — production tier
# Loaded when RUSTANGO_ENV=prod. Strict-by-default; sensitive values
# (database url, secret key) come from the environment or your secrets
# manager — leaving them out of source control.

# The URL comes from the `DATABASE_URL` environment variable, which is
# what every pool reads. Set it from your secrets manager.
#
# Pool sizes can be pinned here. If you do, uncomment the header *with*
# the keys: a key left uncommented under a commented-out `[database]`
# lands at the TOML root, where it is silently ignored.
# [database]
# pool_min_size = 5
# pool_max_size = 50

[server]
bind                 = "0.0.0.0:8080"
request_timeout_secs = 30

[security]
headers_preset    = "strict"
hsts_max_age_secs = 31536000

[audit]
retention_days = 365

[cache]
# The storefront page cache. `redis` is the only backend that is shared
# across processes, which is the point: six app instances behind one
# fleet must hit the same cache or each just warms its own.
#
# `redis_url` has no default and `cache::from_settings_async` errors
# rather than quietly falling back to memory, so a misconfigured
# deployment fails at boot instead of silently losing the cache. The
# soak sets it from the environment as `RUSTANGO__CACHE__REDIS_URL`.
backend = "redis"
