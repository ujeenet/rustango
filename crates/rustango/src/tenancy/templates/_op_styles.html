<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
  color: var(--color-fg);
  background: var(--color-bg);
}
.shell { display: flex; min-height: 100vh; }
aside.sidebar {
  width: 220px;
  background: var(--color-bg-sidebar);
  border-right: 1px solid var(--color-border);
  padding: var(--space-4) 0;
  display: flex;
  flex-direction: column;
}
aside .brand {
  font-weight: var(--font-weight-bold);
  padding: 0 var(--space-4) var(--space-4) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  margin-bottom: var(--space-3);
  color: var(--color-accent);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
aside .brand img.brand-logo {
  /* Explicit `height` (not `max-height`) because the parent
     `.brand` is a flex column whose default `min-height: auto`
     resolves to the image's intrinsic 1024px and overrides
     `max-height: 48px`. `align-self: flex-start` stops the
     stretch-to-cross-axis behavior. (#73) */
  display: block;
  height: 40px;
  width: auto;
  max-width: 100%;
  align-self: flex-start;
  object-fit: contain;
}
aside .brand .brand-tagline {
  font-weight: var(--font-weight-normal);
  font-size: var(--font-size-sm);
  color: var(--color-fg-muted);
}
aside nav { flex: 1; }
aside nav a {
  display: block;
  padding: 0.55rem var(--space-4);
  color: var(--color-fg);
  text-decoration: none;
  border-left: 3px solid transparent;
}
aside nav a:hover { background: var(--color-bg-hover); }
aside nav a.active {
  background: var(--color-accent-bg-soft);
  border-left-color: var(--color-accent);
  font-weight: var(--font-weight-bold);
}
aside .who {
  padding: var(--space-2) var(--space-4);
  font-size: var(--font-size-sm);
  color: var(--color-fg-muted);
  border-top: 1px solid var(--color-border);
}
aside form.logout button {
  width: calc(100% - 2rem);
  margin: var(--space-2) var(--space-4);
  padding: 0.4rem 0.6rem;
  background: var(--color-bg-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font: inherit;
  cursor: pointer;
  color: var(--color-fg);
}
aside form.logout button:hover { background: var(--color-accent-bg-soft); border-color: var(--color-accent); }
main {
  flex: 1;
  padding: var(--space-5) var(--space-6);
  overflow-x: auto;
}
h1 { margin-top: 0; color: var(--color-accent); }
table { border-collapse: collapse; width: 100%; margin-top: var(--space-4); }
th, td {
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-border);
}
th {
  background: var(--color-bg-sidebar);
  font-weight: var(--font-weight-bold);
  color: var(--color-fg-muted);
  font-size: var(--font-size-sm);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
tr:hover td { background: var(--color-bg-hover); }
.empty {
  color: var(--color-fg-muted);
  font-style: italic;
  padding: var(--space-4) 0;
}
code {
  background: var(--color-bg-code);
  color: var(--color-fg);
  padding: 0.1rem 0.35rem;
  border-radius: var(--radius-sm);
  font-family: var(--font-family-mono);
  font-size: 0.9em;
}
.breadcrumb {
  font-size: var(--font-size-sm);
  color: var(--color-fg-muted);
  margin-bottom: var(--space-2);
}
.breadcrumb a { color: var(--color-fg-muted); text-decoration: none; }
.breadcrumb a:hover { color: var(--color-accent); text-decoration: underline; }
.breadcrumb .sep { padding: 0 0.35rem; color: var(--color-border-strong); }
.lead {
  color: var(--color-fg-muted);
  max-width: 60ch;
  font-size: 13px;
  margin: var(--space-1) 0 var(--space-5) 0;
}
.alert {
  padding: 0.6rem 0.85rem;
  border-radius: var(--radius-md);
  margin: var(--space-3) 0 var(--space-4) 0;
  font-size: 13px;
  border: 1px solid;
}
.alert-error  {
  background: var(--color-error-bg);
  border-color: var(--color-error-border);
  color: var(--color-error-fg);
}
.alert-notice {
  background: var(--color-success-bg);
  border-color: var(--color-success-fg);
  color: var(--color-success-fg);
}
/* `margin-bottom` keeps the branding sub-form clear of the
   primary edit form's Save row when both render on the same
   page (#70). */
form.edit-form { max-width: 720px; margin-bottom: var(--space-6); }
form.edit-form + form.edit-form { margin-top: var(--space-6); }
fieldset.section {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4) var(--space-2) var(--space-4);
  margin: 0 0 var(--space-4) 0;
  background: var(--color-bg-surface);
}
fieldset.section > legend {
  padding: 0 var(--space-2);
  color: var(--color-fg-muted);
  font-size: var(--font-size-xs);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: var(--font-weight-bold);
}
fieldset.section table { margin-top: 0; }
fieldset.section th, fieldset.section td {
  border-bottom: 0;
  padding: 0.4rem 0.6rem 0.4rem 0;
  vertical-align: top;
}
fieldset.section tr:hover td { background: transparent; }
fieldset.section th {
  background: transparent;
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
  color: var(--color-fg);
  width: 12rem;
  font-family: var(--font-family-mono);
}
.field-helper {
  color: var(--color-fg-muted);
  font-size: var(--font-size-sm);
  margin-top: var(--space-1);
}
.form-actions {
  margin-top: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.btn {
  font: inherit;
  padding: 0.45rem var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
}
.btn-primary {
  background: var(--color-accent);
  color: var(--color-fg-on-accent);
  border-color: var(--color-accent);
}
.btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
/* #253 follow-up — secondary + danger variants synced from the
   admin's `.btn` family so the same class names render identically
   on both consoles. */
.btn-secondary {
  background: transparent;
  color: var(--color-accent);
  border-color: var(--color-accent);
}
.btn-secondary:hover {
  background: var(--color-accent-bg-soft);
  color: var(--color-accent);
}
.btn-danger {
  background: transparent;
  color: var(--color-error-fg, #b04141);
  border-color: var(--color-error-fg, #b04141);
}
.btn-danger:hover {
  background: var(--color-error-fg, #b04141);
  color: #fff;
}
/* #253 follow-up — synced with admin's `.btn-link` so the same
   element renders identically on both consoles. Previously this
   used `--color-fg-muted` (too low-contrast on the warm beige
   sidebar surface — operators complained the link was nearly
   invisible). Accent gives high contrast in both themes and
   matches the rest of the chrome's link style. */
.btn-link {
  color: var(--color-accent);
  text-decoration: none;
  font-size: 13px;
  background: transparent;
  border: 0;
  font-weight: var(--font-weight-medium, 500);
}
.btn-link:hover { color: var(--color-accent-hover); text-decoration: underline; }
/* Inline action button in tables (#75). Pill-shaped, accent-tinted,
   doesn't compete visually with the row data. */
.btn-row-action {
  display: inline-block;
  padding: 0.2rem 0.7rem;
  border-radius: var(--radius-sm);
  background: var(--color-accent-bg-soft);
  color: var(--color-accent);
  /* #253 follow-up — relative size (matches admin's `.btn-row-action`)
     so both consoles inherit from their context uniformly. */
  font-size: 0.85em;
  text-decoration: none;
  border: 1px solid transparent;
  line-height: 1.4;
}
.btn-row-action:hover {
  background: var(--color-accent);
  color: var(--color-fg-on-accent);
  text-decoration: none;
}
th.actions-col, td.actions-col { text-align: right; white-space: nowrap; }
fieldset.section input[type="text"],
fieldset.section input[type="number"],
fieldset.section input[type="date"],
fieldset.section input[type="datetime-local"],
fieldset.section input[type="file"],
fieldset.section textarea,
fieldset.section select {
  width: 100%;
  max-width: 28rem;
  padding: 0.4rem var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font: inherit;
  background: var(--color-bg-input);
  color: var(--color-fg);
}
fieldset.section input[type="text"]:focus,
fieldset.section input[type="number"]:focus,
fieldset.section textarea:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 2px var(--color-accent-bg-soft);
}
fieldset.section input[type="checkbox"] { margin-right: 0.4rem; }
fieldset.section input[readonly] {
  background: var(--color-bg-sidebar);
  color: var(--color-fg-muted);
  cursor: not-allowed;
}
fieldset.section.locked code {
  font-size: 13px;
  background: transparent;
  padding: 0;
}
fieldset.section.locked th { color: var(--color-fg-muted); }
fieldset.section .brand-asset-preview {
  display: block;
  max-height: 48px;
  max-width: 100%;
  margin-bottom: var(--space-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1);
  background: var(--color-bg-surface);
}
.theme-toggle {
  position: fixed;
  bottom: var(--space-4);
  right: var(--space-4);
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-bg-surface);
  color: var(--color-fg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font: inherit;
  font-size: var(--font-size-sm);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  z-index: 100;
}
.theme-toggle:hover { border-color: var(--color-accent); color: var(--color-accent); }
.theme-toggle:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
</style>
