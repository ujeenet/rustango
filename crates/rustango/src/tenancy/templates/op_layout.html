<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}rustango operator console{% endblock %}</title>
  <style>
    :root {
      --bg: #fdfdfd;
      --fg: #222;
      --muted: #666;
      --border: #d0d0d0;
      --accent: #b04a2c;     /* warm rust */
      --accent-bg: #f7e9e1;
      --sidebar-bg: #f5f0eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .shell { display: flex; min-height: 100vh; }
    aside.sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
    }
    aside .brand {
      font-weight: 700;
      padding: 0 1rem 1rem 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    aside nav { flex: 1; }
    aside nav a {
      display: block;
      padding: 0.55rem 1rem;
      color: var(--fg);
      text-decoration: none;
      border-left: 3px solid transparent;
    }
    aside nav a:hover { background: rgba(176, 74, 44, 0.05); }
    aside nav a.active {
      background: var(--accent-bg);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    aside .who {
      padding: 0.5rem 1rem;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    aside form.logout button {
      width: calc(100% - 2rem);
      margin: 0.5rem 1rem;
      padding: 0.4rem 0.6rem;
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
      cursor: pointer;
      color: var(--fg);
    }
    aside form.logout button:hover { background: var(--accent-bg); border-color: var(--accent); }
    main {
      flex: 1;
      padding: 1.5rem 2rem;
      overflow-x: auto;
    }
    h1 { margin-top: 0; color: var(--accent); }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: var(--sidebar-bg);
      font-weight: 600;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover td { background: rgba(176, 74, 44, 0.03); }
    .empty {
      color: var(--muted);
      font-style: italic;
      padding: 1rem 0;
    }
    code {
      background: var(--sidebar-bg);
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      font-size: 0.9em;
    }
    /* ---------- Forms (op_orgs_edit) ---------- */
    .breadcrumb {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--accent); text-decoration: underline; }
    .breadcrumb .sep { padding: 0 0.35rem; color: #bbb; }
    .lead {
      color: var(--muted);
      max-width: 60ch;
      font-size: 13px;
      margin: 0.25rem 0 1.25rem 0;
    }
    .alert {
      padding: 0.6rem 0.85rem;
      border-radius: 4px;
      margin: 0.75rem 0 1rem 0;
      font-size: 13px;
      border: 1px solid;
    }
    .alert-error  { background: #fbeae6; border-color: #d9534f; color: #842c25; }
    .alert-notice { background: #e8f4ec; border-color: #5cb85c; color: #1f5132; }
    form.edit-form { max-width: 720px; }
    fieldset.section {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem 1rem 0.5rem 1rem;
      margin: 0 0 1rem 0;
    }
    fieldset.section > legend {
      padding: 0 0.5rem;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
    }
    fieldset.section table { margin-top: 0; }
    fieldset.section th, fieldset.section td {
      border-bottom: 0;
      padding: 0.4rem 0.6rem 0.4rem 0;
      vertical-align: top;
    }
    fieldset.section tr:hover td { background: transparent; }
    fieldset.section th {
      background: transparent;
      text-transform: none;
      letter-spacing: 0;
      font-size: 13px;
      color: var(--fg);
      width: 12rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .field-helper {
      color: var(--muted);
      font-size: 12px;
      margin-top: 0.25rem;
    }
    .form-actions {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      font: inherit;
      padding: 0.45rem 1rem;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #993f25; border-color: #993f25; }
    .btn-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }
    .btn-link:hover { color: var(--accent); text-decoration: underline; }
    /* sane defaults for inputs the admin's render_input emits */
    fieldset.section input[type="text"],
    fieldset.section input[type="number"],
    fieldset.section input[type="date"],
    fieldset.section input[type="datetime-local"],
    fieldset.section textarea,
    fieldset.section select {
      width: 100%;
      max-width: 28rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      font: inherit;
      background: white;
    }
    fieldset.section input[type="text"]:focus,
    fieldset.section input[type="number"]:focus,
    fieldset.section textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-bg);
    }
    fieldset.section input[type="checkbox"] { margin-right: 0.4rem; }
    fieldset.section input[readonly] {
      background: var(--sidebar-bg);
      color: var(--muted);
      cursor: not-allowed;
    }
    fieldset.section.locked code {
      font-size: 13px;
      background: transparent;
      padding: 0;
    }
    fieldset.section.locked th { color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">rustango</div>
      <nav>
        <a href="/" class="{% if section == 'home' %}active{% endif %}">Home</a>
        <a href="/operators" class="{% if section == 'operators' %}active{% endif %}">Operators</a>
        <a href="/orgs" class="{% if section == 'orgs' %}active{% endif %}">Organizations</a>
      </nav>
      <div class="who">signed in as <strong>{{ operator_username }}</strong></div>
      <form class="logout" method="post" action="/logout">
        <button type="submit">Sign out</button>
      </form>
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
