[package]
name = "rustango"
description = "Django-shaped batteries-included web framework for Rust: ORM + migrations + auto-admin + multi-tenancy + audit log + auth (sessions, JWT, OAuth2/OIDC, HMAC) + APIs (ViewSet, OpenAPI auto-derive, JSON:API) + jobs (in-mem + Postgres) + email + media (S3 / R2 / B2 / MinIO + presigned uploads + collections + tags) + production middleware (CSRF, CSP, rate-limiting, compression, idempotency, etc.)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Drop runnable demos + integration-test files from the published
# tarball. `src/admin/templates/` and `src/tenancy/{templates,static}/`
# stay — they're baked into the binary via include_str! / include_bytes!.
exclude = ["examples/", "tests/"]

# docs.rs builds with **default features only** unless told otherwise, and
# several headline modules are not in `default`: `tenancy`, `sso`, `mcp`,
# `passkey`, `admin-sso`, `cache-redis`. Without this section every one of them
# 404s on docs.rs — so multi-tenancy, the framework's flagship differentiator,
# had no published API documentation at all, and a reader arriving from the
# README would reasonably conclude the feature does not exist.
#
# `all-features` rather than an explicit list because the three backends
# coexist by design (the tri-dialect work makes `postgres,mysql,sqlite`
# together a supported, CI-tested combination), so there is nothing to exclude.
#
# `--cfg docsrs` enables `#[cfg_attr(docsrs, doc(cfg(...)))]` badges, so each
# gated item shows which feature unlocks it instead of appearing unconditional.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# Out of the box: ORM + auto-admin + Postgres + layered config +
# public forms framework. Opt in to multi-tenancy with
# `features = ["tenancy"]`. Drop `default-features` for the bare
# ORM (core + query + sql + migrate).
default = ["postgres", "batteries"]

# Everything `default` gives you **except** the database backend (#1211).
#
# A downstream project cannot use `default` and still choose its backend:
# `#[derive(Model)]` gates its `FromRow` / `LoadRelated` emissions on the
# *consumer's* features (a cfg inside a derive resolves against the destination
# crate), so if the dependency pins `rustango/postgres` while the project's own
# `postgres` feature is off, rustango demands impls the derive never emitted.
# Naming `batteries` instead lets the project forward the backend through its
# own feature:
#
#     rustango = { version = "…", default-features = false, features = ["batteries"] }
#
#     [features]
#     default  = ["postgres"]
#     postgres = ["rustango/postgres"]
#     sqlite   = ["rustango/sqlite"]
#
# `cargo rustango new` emits exactly that. Keeping the list here rather than in
# the generated manifest means it can't rot out of sync with `default`.
batteries = ["manage", "admin", "config", "forms", "serializer", "cache", "signals", "email", "storage", "scheduler", "secrets", "totp", "webhook", "webhook-delivery", "api_keys", "passwords", "signed_url", "notifications", "casts", "jobs", "jobs-postgres", "auth_flows", "sse", "websocket", "oauth2", "http-client", "compression", "openapi", "csp-nonce", "sessions", "hmac-auth", "jwt", "uploads", "storage-s3", "media", "runserver", "template_views"]
postgres = ["sqlx/postgres"]

# Unified `cargo run` / `cargo run -- <verb>` dispatcher. Pulls the
# minimum axum + tokio surface so bare-API projects (without admin)
# can still use `rustango::manage::Cli::new().api(...).run().await`.
# v0.16+. Default-on so `cargo rustango new` projects work with no
# extra opt-ins.
manage = ["_axum", "runtime"]

# Test-only constructors for downstream live tests. Currently
# unlocks `Tenant::for_test(org, conn)` so tenancy-aware crates
# (rustango-cms, etc.) can build a Tenant without booting a full
# axum server with TenantContext. v0.30.26+.
test_utils = []

# Dev-only test-support helpers (`crate::testkit`): build framework
# tables from `Model::SCHEMA` (no hand-written DDL) + model factories
# for struct-update construction. Integration tests are external
# crates, so the module must be public API behind this feature; it
# pulls in nothing and costs a normal build nothing.
testkit = []

# MySQL 8.0+ backend. Fully tri-dialect since v0.38: every framework
# surface (ORM, migrations, admin, tenancy database-mode, jobs queue,
# audit, media, contenttypes, permissions, inspectdb, ViewSet,
# Serializer) works against MySQL through the same `&Pool` API as
# Postgres. Schema-mode tenancy remains Postgres-only by language
# semantics (`SET search_path` has no MySQL equivalent).
mysql = ["sqlx/mysql"]

# SQLite 3.35+ backend. Fully tri-dialect since v0.38: every framework
# surface works against a file-backed or in-memory SQLite DB through
# the same `&Pool` API as Postgres. v0.40 turns on `foreign_keys`,
# `journal_mode = WAL` (file-backed), and `busy_timeout = 5000` on
# every connection via `sql::pool::sqlite_connect_options` — apps
# don't have to remember the SQLite-default-off FK pragma.
sqlite = ["sqlx/sqlite"]

# ---------------------------------------------------------------------
# Internal capability features (#1208). Not for downstream use — enable a
# product feature instead; these carry a leading underscore to say so.
#
# The problem they solve: several modules are declared `pub mod` with no
# `cfg` at all, but their bodies use an *optional* dependency. That only
# builds when some unrelated product feature happens to have pulled the
# dep in, so `--no-default-features --features postgres,manage` (and most
# other minimal sets) failed with dozens of "unlinked crate" errors deep
# inside the framework. `cfg(feature = "...")` cannot ask "is dep:rand
# enabled?", so each optional dep that a module needs gets a capability
# feature, every product feature enables the capability rather than the
# dep, and the module gates on the capability.
#
# Adding an optional dep to a module? Give it a capability here, route the
# product features through it, and gate the module — do not leave the
# module unconditional.
_rand         = ["dep:rand"]
_tera         = ["dep:tera"]
_tower        = ["dep:tower"]
_axum         = ["dep:axum"]
_async_trait  = ["dep:async-trait"]
_base64       = ["dep:base64"]
# The three that always travel together for cookie/token signing.
_signing      = ["_base64", "dep:hmac", "dep:sha2"]

# Layered TOML config (`rustango::config`). Loads `config/default.toml`
# → `config/{env}.toml` → env-var overrides. Slice 8.3.
config = ["dep:toml"]

# Public forms framework (`rustango::forms`) — value parsing for HTML
# form payloads, shared between admin and user route handlers. Slice
# 8.4A ships the parsers; slice 8.4B added `#[derive(Form)]`. Slice
# 8.4C lights up CSRF protection behind the `csrf` sub-feature so
# parser-only users don't pay the cookie/rand cost.
forms = []

# Serializer layer (`rustango::serializer`) — `#[derive(Serializer)]` +
# `ModelSerializer` trait. Produces typed JSON output from model instances
# with field control (read_only, write_only, source, skip) and cross-field
# validation. Implies `forms` so serializer errors share `FormErrors`.
serializer = ["forms"]

# Caching layer (`rustango::cache`) — pluggable `Cache` trait with
# `NullCache` (no-op) and `InMemoryCache` (tokio RwLock + TTL). Redis
# backend is behind the separate `cache-redis` feature.
cache = ["_async_trait", "dep:sha2"]

# Per-view caching tower layer (`rustango::cache_page`) — Django's
# @cache_page / @cache_control / @vary_on_headers analogs. Implies
# `cache` (cache backend) + `admin` (axum types) + base64 for body
# round-trip serialization. Issue #55.
cache-page = ["cache", "admin", "dep:base64"]

# Signals layer (`rustango::signals`) — Django-shape pre_save / post_save
# / pre_delete / post_delete async dispatch. Receivers register globally
# per model type; senders fire signals after write paths.
#
# Empty list, not dead config: the feature still gates `rustango::signals` and
# the emission sites in `migrate::runner` / `sql::m2m`. It carried `dep:tokio`
# until tokio became unconditional.
signals = []

# Email backends (`rustango::email`) — Mailer trait + ConsoleMailer +
# InMemoryMailer + NullMailer. SMTP and external transports plug in via
# the trait.
email = ["_async_trait"]

# Production SMTP backend (`rustango::email::SmtpMailer`, issue #48).
# Implies `email`. Pulls `lettre` with rustls TLS (no openssl).
# Default builds don't include this — opt in when you ship to prod and
# need a real relay (Postmark, SendGrid, AWS SES via SMTP, etc.).
email-smtp = ["email", "dep:lettre"]

# Multi-channel notifications layer (`rustango::notifications`) — Laravel-shape
# fan-out across mail / database / log / broadcast. Implies email + cache.
notifications = ["email", "cache"]

# Background job queue (`rustango::jobs`) — Job trait, in-memory queue,
# worker pool, retry with exponential backoff, dead-letter callback.
jobs = ["_async_trait"]

# Database-backed job queue (`rustango::jobs::pg::PgJobQueue`).
# v0.38 — tri-dialect: PostgreSQL + MySQL 8.0+ use `FOR UPDATE SKIP
# LOCKED` for safe multi-process pickup; SQLite uses a transaction
# around `UPDATE … RETURNING` (SQLite serializes writers globally so
# the pickup is implicitly mutually-exclusive). The feature name is
# `jobs-postgres` for back-compat with v0.37 — the queue itself is
# no longer PG-only. The struct is still `PgJobQueue` for the same
# back-compat reason; new code can use `PgJobQueue::new_pool(pool)`.
jobs-postgres = ["jobs"]

# Pre-built auth flows (`rustango::auth_flows`) — password reset, email
# verification, magic-link login. Composes signed_url + email helpers.
auth_flows = ["signed_url"]

# Broadcast event bus (`rustango::sse`) — fan-out for SSE / WebSocket /
# signal-driven push. tokio::sync::broadcast under the hood.
#
# Empty list, not dead config — still gates `rustango::sse`. Carried
# `dep:tokio` until tokio became unconditional.
sse = []

# WebSocket handler scaffold (`rustango::ws`) — fan-out via the SSE
# EventBus, axum upgrade handler with auto JSON encode/decode + ping/pong
# keep-alive. Implies `admin` (axum) + `sse` (broadcast bus). Adds
# tokio-tungstenite via the `axum/ws` feature.
websocket = ["admin", "sse", "axum/ws"]

# Model Context Protocol server (`rustango::mcp`) — expose tools / prompts
# / resources to external ML agents over JSON-RPC 2.0 + Streamable HTTP.
# Tenant-scoped agent identities + scoped-JWT auth (Slice 2+). `tenancy`
# brings the agent/skill models + per-request pool; `sse` the server→client
# notification bus; `serializer`/`openapi` the tool inputSchema; `jwt`
# exposes `crate::signing` (agent-bound pagination cursors) and reflects that
# MCP agent tokens are JWTs. Epic #1013.
mcp = ["tenancy", "sse", "serializer", "openapi", "jwt", "_axum", "dep:async-stream"]

# OAuth2 / OIDC swiss-knife (`rustango::oauth2`) — works for pure OAuth2
# providers (GitHub, Discord) AND OIDC providers (Google, Microsoft,
# Apple, Keycloak) via the `/userinfo` endpoint as identity source.
# Per-tenant via `OAuth2Registry`. Pulls reqwest (rustls — no openssl).
oauth2 = ["_signing", "dep:reqwest", "dep:urlencoding", "_rand", "dep:subtle", "_async_trait"]

# Opinionated HTTP client (`rustango::http_client`) — reqwest wrapper
# with sane timeouts, exponential-backoff retry on idempotent verbs +
# 5xx/timeout/connect failures, and a default User-Agent. Standalone
# wrapper that any rustango app can use directly.
http-client = ["dep:reqwest"]

# Response compression middleware (`rustango::compression`) — gzip +
# deflate via flate2 (miniz_oxide by default, no C deps). Honors the
# client's `Accept-Encoding`, skips already-compressed and binary
# content-types. Implies `admin` (axum-only).
compression = ["admin", "dep:flate2"]

# Per-request CSP nonce middleware (`rustango::csp_nonce`) — generates
# a fresh CSPRNG nonce per request, stuffs it into request extensions
# for handlers to consume, and substitutes it into the
# Content-Security-Policy header so inline `<script nonce="…">` blocks
# pass strict CSP. Implies `admin` (axum-only) + rand for the nonce.
csp-nonce = ["admin", "_rand"]

# Server-side sessions (`rustango::sessions`) — opaque cookie ID
# backed by any `Cache` implementation. Implies `cache` + rand for
# the ID + base64 for encoding it.
sessions = ["cache", "_rand", "dep:base64"]

# HMAC-signed request authentication (`rustango::hmac_auth`) for
# service-to-service traffic. AWS-style canonical request signed with
# SHA-256, replay-bounded by an X-Date tolerance window. Implies
# `admin` (axum) + the existing webhook crypto deps.
hmac-auth = ["_signing", "admin", "dep:subtle"]

# Standalone HS256 JWT (`rustango::jwt`) — sign / verify / decode for
# magic links, microservice tokens, third-party SSO. Standalone
# alternative to `tenancy::jwt_lifecycle` (which adds refresh +
# blacklist + sliding rotation but is gated on tenancy; since v0.48
# its blacklist is also pluggable via `Arc<dyn rustango::jti_store::JtiStore>`
# for multi-instance deployments).
jwt = ["_signing", "dep:subtle"]

# Multipart file upload helper (`rustango::uploads`) — wraps
# axum's multipart extractor + the `storage::Storage` trait so file
# uploads are a one-call API with size + extension guards. Pulls
# `multer` transitively via `axum/multipart`.
uploads = ["admin", "storage", "axum/multipart"]

# First-class media model (`rustango::media`) — a Media row that
# references a file in the Storage layer. Handles direct browser
# upload (via S3 presigning), CDN-aware URLs, soft delete + orphan
# purge sweep. v0.38 — tri-dialect: every query dispatches per
# backend (PG / MySQL 8+ / SQLite), so `media` now only requires
# `storage` + at least one database backend feature
# (postgres / mysql / sqlite).
media = ["storage"]

# S3-compatible storage backend (`rustango::storage::s3::S3Storage`).
# Hand-rolled SigV4 over reqwest — works for AWS S3, Cloudflare R2,
# Backblaze B2, MinIO, and any other S3-compatible API. No
# `aws-sdk-s3` dependency.
storage-s3 = ["storage", "dep:reqwest", "dep:hmac", "dep:sha2"]

# OpenAPI 3.1 spec builder + Swagger UI router (`rustango::openapi`).
# Pure-Rust types you assemble into a spec, serialized to JSON via serde.
# Optional axum mount at `/openapi.json` + `/docs` (Swagger UI from a
# CDN). Forwards through to the proc-macro so `#[derive(Serializer)]`
# also emits an `OpenApiSchema` impl.
openapi = ["rustango-macros/openapi"]

# File storage backends (`rustango::storage`) — Storage trait + LocalStorage
# (filesystem) + InMemoryStorage (tests). S3/GCS/Azure plug in via the trait.
storage = ["_async_trait"]

# In-process scheduled task runner (`rustango::scheduler`) — fire async jobs
# at fixed intervals with panic isolation per task.
#
# Empty list, not dead config — still gates `rustango::scheduler`. Carried
# `dep:tokio` until tokio became unconditional.
scheduler = []

# Secrets manager (`rustango::secrets`) — Secrets trait + EnvSecrets +
# InMemorySecrets. Vault / AWS / GCP plug in via the trait.
secrets = ["_async_trait"]
# Attribute casts (#819) — `Cast<C>` field wrapper + `CastValue` trait;
# the `EncryptedString` built-in pulls XChaCha20-Poly1305 + base64 + a
# SHA-256 key derivation (`rand` for the per-write nonce).
casts = ["dep:chacha20poly1305", "dep:base64", "_rand", "dep:sha2"]

# TOTP / 2FA (`rustango::totp`) — RFC 6238 time-based one-time passwords
# for second-factor authentication. SHA-1 (Google Authenticator default).
totp = ["dep:hmac", "dep:sha1", "_rand", "dep:subtle"]
# Passkey / WebAuthn (#392). Foundation slice = credential storage only
# (no extra deps). The ceremony layer adds pure-Rust CBOR (`ciborium`) +
# ES256 (`p256`) when it lands — keeping the all-RustCrypto, no-C-dep
# stack (vs `webauthn-rs` → openssl).
passkey = ["_rand", "dep:base64", "dep:sha2", "dep:subtle", "dep:ciborium", "dep:p256"]

# Webhook signature verification (`rustango::webhook`) — HMAC-SHA256
# constant-time verification for inbound webhooks (Stripe, GitHub, etc.).
webhook = ["_signing", "dep:subtle"]

# Outbound webhook delivery (`rustango::webhook_delivery`) — POSTs an
# HMAC-signed JSON payload to a subscriber URL via the background job
# queue (so retries with exponential backoff are free). Implies
# `webhook` (signing format) + `jobs` (retry machinery) + reqwest.
webhook-delivery = ["webhook", "jobs", "dep:reqwest"]

# API keys (`rustango::api_keys`) — standalone generate/hash/verify
# helpers for `{prefix}.{secret}` keys with argon2id hashing.
api_keys = ["dep:argon2", "dep:password-hash", "_rand"]

# Generic password helpers (`rustango::passwords`) — argon2id hash/verify
# + minimal strength check. Standalone alternative to tenancy::password.
passwords = ["dep:argon2", "dep:password-hash"]

# Signed URL helpers (`rustango::signed_url`) — HMAC-SHA256 signed URLs
# with optional expiry. For magic-link login, password resets, etc.
signed_url = ["_signing", "dep:subtle"]

# Redis cache backend (`rustango::cache::RedisCache`). Adds the `redis`
# async connection-manager client. Implies `cache`.
cache-redis = ["cache", "dep:redis"]

# CSRF protection (`rustango::forms::csrf`) — double-submit-cookie
# axum middleware. Lives behind its own flag so `forms`-only users
# (parsers without CSRF) don't pull cookie + rand + tower
# transitively.
csrf = ["forms", "_axum", "dep:base64", "dep:cookie", "_rand", "_tower"]

# Generic class-based views for HTML templates (`rustango::template_views`)
# — Django-shape `ListView` / `DetailView` / `CreateView` / `UpdateView` /
# `DeleteView` over `#[derive(Model)]` types, rendered through Tera.
# The JSON-API counterpart is `rustango::viewset` (always on).
template_views = ["forms", "_axum", "_tera", "dep:serde_urlencoded"]

# Auto-admin HTTP layer (`rustango::admin`). Pulls in axum + Tera +
# the supporting middleware deps. Implies `forms` + `csrf` so the
# admin's CRUD handlers reuse the shared parsers and ship CSRF on
# every mutation by default.
#
# v0.37 — admin is **fully tri-dialect**: every fetch goes through
# `select_*_as_json_pool`, every audit + permissions path is on
# `_pool` companions, and SQL is rendered via the dialect's
# `quote_ident` + `placeholder` emitters. The admin feature no
# longer implies `postgres`; pick whichever of `postgres` / `mysql`
# / `sqlite` your project needs and the admin works against it.
admin = [
    "forms",
    "csrf",
    # #253 — admin session auth uses argon2 via crate::passwords for
    # the AdminUser password hash. `passwords` was already a
    # transitive dep through forms/tenancy in practice; this makes
    # the relationship explicit so `--features sqlite,admin` builds
    # cleanly without `tenancy` or `passwords` named.
    "passwords",
    # #414 — login / logout handlers fire the auth lifecycle signals
    # (`user_logged_in` / `user_logged_out` / `user_login_failed`).
    # Tokio was already in the admin closure; signals adds only the
    # in-process registry helpers.
    "signals",
    "_axum",
    "_tera",
    "_signing",
    "dep:subtle",
    # `manage create-admin` (slice B) prompts for a password
    # interactively when `--password` isn't supplied. `rpassword` was
    # tenancy-only before #253; admin now picks it up too.
    "dep:rpassword",
    "dep:http",
    "dep:http-body-util",
    "dep:serde_urlencoded",
]

# SSO for the admin login (`rustango::admin::sso`) — sign in with an
# external IdP (OpenID Connect, Google, Microsoft/Azure AD, GitHub, …)
# instead of a local password. Composes the existing `oauth2` client
# (the OIDC/OAuth2 handshake) with `admin` (the session + user model).
# Access is *link-to-existing* — the verified IdP email must match an
# admin user; SSO never auto-provisions. Works for the bare admin
# (global `[sso]` config) and, with `tenancy`, per-Org.
#
# Composes the admin-independent `sso` core (below) with `admin` (the
# session + user model). `admin-sso` = `admin` + `sso`; `sso` transitively
# brings `oauth2` + `casts`.
admin-sso = ["admin", "sso"]

# SSO core (`rustango::sso`) — the admin-INDEPENDENT OpenID Connect /
# social-OAuth handshake plumbing (`ResolvedSso`, `build_provider`,
# `verified_email`, …) plus the DB-backed `SsoProvider` model
# (`rustango_sso_providers`). No `admin` dependency, so member / end-user
# SSO (`tenancy::member_auth`) can build without pulling in the auto-admin.
# Composes the existing `oauth2` client with `casts` (encrypted-at-rest
# client secret). `admin-sso` layers the admin login wiring on top.
sso = ["oauth2", "casts"]

# Multi-tenancy module (`rustango::tenancy`). Implies `admin` (the
# tenant admin builder wraps `rustango::admin`). Pulls in Argon2 +
# HMAC-SHA256 + cookie + tower for the per-tenant + operator
# authentication paths. Implies `storage` + `uploads` so the operator
# console can persist per-tenant brand assets (logo / favicon) on
# disk and serve them via the tenancy router.
tenancy = [
    # v0.38 — `tenancy` no longer implies `postgres`. Database-per-tenant
    # mode (`DatabasePools<DB>`, since v0.33) works on Postgres, MySQL,
    # and SQLite alike. Schema-mode tenancy is still Postgres-only by
    # language semantics (uses `SET search_path`); the framework's
    # tenancy/migrate + tenancy/pools code paths keep their
    # `#[cfg(feature = "postgres")]` gates around schema-mode-specific
    # logic, and the runtime returns a clear error when a non-PG
    # registry is asked to serve a schema-mode tenant.
    #
    # Picking a backend: add `--features sqlite,tenancy,admin`,
    # `--features mysql,tenancy`, or `--features postgres,tenancy,admin`
    # depending on the target deployment. Apps that *also* want
    # schema-mode tenants get `postgres` automatically by including it.
    "runtime",
    # #414 — tenant admin + operator console login_submit / logout
    # fire the auth lifecycle signals.
    "signals",
    "storage",
    "uploads",
    "_async_trait",
    "dep:argon2",
    "dep:cookie",
    # Deliberately the exact pair tenancy carried before #1208, not `_signing`
    # — that capability also pulls `base64`, which tenancy never depended on.
    # The capability features exist to stop the feature table lying about what
    # it pulls in; widening one while introducing them would defeat that.
    "dep:hmac",
    "dep:sha2",
    "dep:password-hash",
    "_rand",
    "dep:rpassword",
    "dep:serde_urlencoded",
    "dep:subtle",
    "_tower",
]

# `#[rustango::main]` runserver shim (slice 9.0 / 0.8.2). Pulls in
# `tracing-subscriber` so the macro can install the default
# `info,sqlx=warn` env-filter logger before the user body runs. Apps
# that don't want this dep can opt out by skipping the macro and
# using `#[tokio::main]` directly.
#
# v0.31.1 (#4): the macro emits
# `#[::rustango::__private_runtime::tokio::main]`, so user crates don't need
# tokio in their own Cargo.toml just to use the rustango entrypoint shim.
# That re-export no longer needs a feature to carry it — tokio is an
# unconditional dependency (see the note on the `tokio` line below).
runtime = ["dep:tracing-subscriber", "dep:tracing-appender"]

# Minimal axum runserver — `rustango::server::AppBuilder`. Bi-dialect
# single-pool bootstrap (SQLite / Postgres / MySQL). Pulls axum; tokio is
# unconditional. The full multi-tenant `Builder` lives behind `tenancy` and
# pulls in much more.
runserver = ["_axum"]

[dependencies]
# Proc-macros — separate by Rust language requirement.
rustango-macros = { version = "0.52.0", path = "../rustango-macros" }

# Always-on: core ORM + query layer + SQL writer + migration runner.
chrono       = { workspace = true }
indexmap     = { workspace = true }
inventory    = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sqlx         = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }

# `config` feature dep — optional.
toml = { workspace = true, optional = true }

# `mcp` feature dep — optional. SSE stream macro for the server→client
# notification channel (same crate the `sse` module's docs point at).
async-stream = { workspace = true, optional = true }

# `admin` feature deps — optional.
axum           = { workspace = true, optional = true }
base64         = { workspace = true, optional = true }
ciborium       = { workspace = true, optional = true }
p256           = { workspace = true, optional = true }
http           = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tera           = { workspace = true, optional = true }

# `tenancy` feature deps — optional.
argon2           = { workspace = true, optional = true }
async-trait      = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
cookie           = { workspace = true, optional = true }
hmac             = { workspace = true, optional = true }
password-hash    = { workspace = true, optional = true }
rand             = { workspace = true, optional = true }
rpassword        = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
sha1             = { workspace = true, optional = true }
sha2             = { workspace = true, optional = true }
subtle           = { workspace = true, optional = true }
# Non-optional since #1208 follow-up. `sqlx` is a hard dependency built with
# `runtime-tokio`, so tokio is already compiled into every build including
# `--no-default-features --features sqlite` — `optional = true` only controlled
# whether rustango was allowed to *name* the crate it was already linking.
# Meanwhile the modules that need it are core, not opt-in: the transaction
# on-commit registry (`sql::executor::atomic`), the audit source task-local,
# and the event bus are all built on `tokio::task_local!` / `tokio::sync`.
# Gating those would have silently removed transaction hooks from a bare-ORM
# build; making the dependency honest costs no extra crate.
tokio            = { workspace = true }
tower            = { workspace = true, optional = true }
redis            = { workspace = true, optional = true }

# `oauth2` feature deps — optional.
reqwest     = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }

# `compression` feature dep — optional.
flate2 = { workspace = true, optional = true }

# `email-smtp` feature dep — optional. rustls TLS only (no openssl).
# `tokio1` enables the async transport; `builder` re-exports the
# Message builder we use for MIME assembly.
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
], optional = true }

# `runtime` feature dep — used by `#[rustango::main]` to install a
# default tracing subscriber (env-filter) before the user body runs.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"], optional = true }
tracing-appender = { workspace = true, optional = true }
# Not used directly — declared only to pin the transitive `time` away from
# the broken 0.3.48 (see the workspace.dependencies note). `time` is
# already pulled by cookie / tracing-appender / sqlx in every real build.
time = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true }
chrono         = { workspace = true }
uuid           = { workspace = true }
serde_json     = { workspace = true }
rust_decimal   = { workspace = true }
tower          = { workspace = true }
http-body-util = { workspace = true }
axum           = { workspace = true }
base64         = { workspace = true }
dotenvy        = { workspace = true }
tempfile       = "3"

# All example crates removed. Single-file examples are auto-detected
# by Cargo; multi-file or required-features examples are declared
# here.

# Multi-tenant blog demo (operator console + tenant admin + viewsets).
# Uses the PG-only `Tenant` extractor / `viewset` / `server::ApiRouter`
# stack — requires postgres feature alongside tenancy. Auto-discovered
# by Cargo because it lives under `examples/blog_demo/` with a
# `main.rs`; gated so sqlite/mysql builds skip it cleanly.
[[example]]
name              = "blog_demo"
path              = "examples/blog_demo/main.rs"
required-features = ["tenancy", "postgres"]

# SQLite ORM demo — single-file example, gated on the `sqlite` feature
# so default `cargo build --examples` doesn't try to compile it.
# Also requires postgres because it derives Model unconditionally
# (macro emits PG paths).
[[example]]
name              = "sqlite_orm_demo"
path              = "examples/sqlite_orm_demo.rs"
required-features = ["sqlite", "postgres"]

# AppBuilder + SQLite — minimal runnable bootstrap shape.
[[example]]
name              = "sqlite_app_demo"
path              = "examples/sqlite_app_demo.rs"
required-features = ["sqlite", "runserver"]

# Epic #246 demo — full GenericForeignKey surface: generic_fk
# accessor/setter codegen, list-view target links, register_admin_inline_generic!
# panels (read-only + editable), CT <select> picker. SQLite-backed,
# no tenancy. Run with `cargo run -p rustango --example gfk_demo
# --features sqlite,admin,runserver`.
[[example]]
name              = "gfk_demo"
path              = "examples/gfk_demo/main.rs"
required-features = ["sqlite", "admin", "runserver"]

# Multi-tenant SQLite demo (v0.33) — wires the DatabaseTenant<Sqlite>
# extractor for per-tenant-file SQLite databases. Pairs with the
# `database_pools_sqlite_*_live.rs` tests; this is the manual-running
# shape downstream apps consume until the Cli builder lands.
# Also requires postgres for the operator_console types it imports.
[[example]]
name              = "sqlite_tenant_demo"
path              = "examples/sqlite_tenant_demo.rs"
required-features = ["sqlite", "tenancy", "runtime", "postgres"]
