[package]
name = "rustango"
description = "A Django-inspired ORM for Rust. Facade crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = ["rustango-sql/postgres"]

[dependencies]
rustango-core    = { workspace = true }
rustango-macros  = { workspace = true }
rustango-query   = { workspace = true }
rustango-sql     = { workspace = true }
rustango-migrate = { workspace = true }
rustango-admin   = { workspace = true }
# rustango-tenancy is intentionally NOT a dep of the facade — it
# depends on the facade itself (so the `#[derive(Model)]` macro's
# `::rustango::core` paths resolve), which would be a cycle. Users
# wanting tenancy add `rustango-tenancy` to their own Cargo.toml.

[dev-dependencies]
tokio          = { workspace = true }
chrono         = { workspace = true }
uuid           = { workspace = true }
serde_json     = { workspace = true }
tower          = { workspace = true }
http-body-util = { workspace = true }
axum           = { workspace = true }
base64         = { workspace = true }

# Multi-file example demonstrating the Django-shape models / views /
# urls split for downstream user projects (slice 6c). Single-file
# examples are auto-detected by Cargo; multi-file ones need this
# explicit declaration.
[[example]]
name = "project_layout"
path = "examples/project_layout/main.rs"
