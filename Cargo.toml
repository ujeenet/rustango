[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.54.0"
readme = "README.md"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ujeenet/rustango"
homepage = "https://github.com/ujeenet/rustango"
documentation = "https://docs.rs/rustango"
keywords = ["web-framework", "orm", "django", "sqlite", "async"]
categories = ["web-programming::http-server", "database", "asynchronous"]

[workspace.dependencies]
# Internal — collapsed shape: one library facade `rustango` (with
# feature flags for admin / tenancy) plus the proc-macro crate which
# Rust requires to live separately.
rustango-macros     = { version = "0.54.0", path = "crates/rustango-macros" }
rustango-orm-macros = { version = "0.54.0", path = "crates/rustango-orm-macros" }
rustango            = { version = "0.54.0", path = "crates/rustango" }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }

# DB — backends are turned on via rustango's own `postgres` /
# `mysql` features so apps can pick a single backend (smaller dep
# tree) or both (one binary serving either). `json` is a fan-out
# feature that wires `sqlx::types::Json<T>: Type<DB>` for whichever
# backend(s) are enabled — needed for MySQL bind() of JSON columns.
# `rust_decimal` fans out `rust_decimal::Decimal ↔ NUMERIC/DECIMAL`
# for every backend so the universal `FieldType::Decimal` round-
# trips through bind/decode without per-dialect special-cases.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "chrono", "uuid", "json", "rust_decimal"] }

# Schema collection + collections
inventory = "0.3"
indexmap  = { version = "2", features = ["serde"] }

# Serde
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Field types
chrono       = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid         = { version = "1", features = ["serde", "v4", "v7"] }
rust_decimal = { version = "1.36", default-features = false, features = ["serde", "std"] }

# Layered config (slice 8.3). `toml` is parser-only; we hand-roll the
# layering + env-var override pass so we don't pull figment in.
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Errors
thiserror = "1"

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = "0.2"

# `time` 0.3.48 shipped an E0119 regression (conflicting `From` impl in
# `format_description::parse`); the workspace gitignores Cargo.lock so CI
# fresh-resolves and picks it up, breaking every build. `time` is pulled
# transitively (cookie / tracing-appender / sqlx date types), so we pin it
# here below 0.3.48. Unpin once a fixed release (0.3.49+) is verified.
time = ">=0.3, <0.3.48"

# Async-trait for dyn-dispatchable async traits (e.g. OrgResolver)
async-trait = "0.1"

# SSE stream macro — used by the `mcp` feature's server→client channel.
async-stream = "0.3"

# HTTP types — used by rustango-tenancy resolvers to inspect request parts
http = "1"

# Password hashing for the 2-domain auth (Operator + per-tenant User)
argon2        = "0.5"
password-hash = "0.5"

# Session cookie crypto for the operator console
hmac    = "0.12"
sha1    = "0.10"   # TOTP / RFC 6238 default
sha2    = "0.10"
subtle  = "2"      # constant-time eq for MAC verify
cookie  = "0.18"
rand    = "0.8"    # session-secret auto-gen fallback
# XChaCha20-Poly1305 AEAD for the `encrypted` attribute cast (#819).
# 24-byte nonce → random per-write nonces are reuse-safe.
chacha20poly1305 = "0.10"

# Interactive manage CLI
dotenvy   = "0.15"
# Was pinned `=7.3.1`: 7.4 used `libc::__errno_location`, which is
# Linux-only and broke macOS builds. Upstream made the errno call
# portable, and 7.5.4 compiles clean on macOS aarch64 — verified before
# lifting the pin. The pin had become a liability: GHSA-2p6r-x3vv-xqm2
# (partial password reveal when input is interrupted) covers `<= 7.4.0`,
# so holding 7.3.1 held us on the vulnerable side of it. Keep this at
# `>= 7.5`.
rpassword = "7.5"

# Admin (HTTP)
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "form", "query", "original-uri"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_urlencoded = "0.7"
base64 = "0.22"
# Passkey / WebAuthn ceremony crypto (#392) — pure-Rust, no C dep.
# `ciborium` parses CBOR (attestationObject / COSE keys); `p256` verifies
# ES256 (P-256 ECDSA) assertion signatures.
ciborium = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
tera = { version = "1.20", default-features = false }

# Caching
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }

# OAuth2 / OIDC HTTP client (rustls — no openssl footprint)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"

# Response compression (gzip + deflate). flate2 chooses the best backend
# at build time (miniz_oxide by default, no C deps).
flate2 = "1"

# Macro deps
syn          = { version = "2", features = ["full", "extra-traits"] }
quote        = "1"
proc-macro2  = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
# missing_docs lints are deferred to week 8 hardening.

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 0
# Disable incremental compilation — the incremental cache balloons
# the `target/` directory by ~13 GiB on this workspace (≈35% of total)
# and we rebuild often enough that the cache rarely hits. Forces every
# `cargo build` / `cargo test` to use the codegen-units split alone
# for parallelism. Saves disk, costs a few % on warm rebuilds.
incremental = false

[profile.test]
opt-level = 0
incremental = false
